<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mapa · Día del Orgullo Cimarrón 2026</title>
<style>
/* El arte es el mapa que se hizo en Illustrator. Este archivo solo lo hace
   interactivo, asi que la paleta sale del propio mapa: el crema del papel
   #f3f9ee, el verde del pasto #179e68, el verde claro #80c458 y el verde
   profundo de los contornos #0a4842.

   El fondo de la pagina va un punto mas verde que el papel del mapa
   (#dfeada frente a #f3f9ee) a proposito: asi se ve donde acaba la hoja y
   los margenes del mapa no se confunden con la pantalla. La reticula de
   puntos remata los margenes en las pantallas anchas. */
:root{
  --papel:#f3f9ee; --fondo:#dfeada; --tinta:#0a4842; --pasto:#179e68;
  --lima:#80c458; --crema:#d6edce; --texto:#0d3b34; --tenue:#4d6d64; --borde:#b8d4bb;
  --verde:#00723f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background-color:var(--fondo);
  background-image:
    radial-gradient(58% 46% at 8% 0%,#179e6820,transparent 65%),
    radial-gradient(52% 44% at 94% 100%,#80c45826,transparent 65%),
    radial-gradient(#c2d9c4 1.3px,transparent 1.4px);
  background-size:auto,auto,26px 26px;
  background-attachment:fixed;
  color:var(--texto);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  touch-action:none;-webkit-tap-highlight-color:transparent;
}
#s{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
/* will-change avisa al navegador de que este <g> se va a transformar, para
   que lo prepare en su propia capa y la animacion no tenga que repintar el
   mapa entero en cada fotograma. Sin esto, en un movil el zoom va a tirones. */
#m{transform-box:view-box;transform-origin:0 0;will-change:transform;
   transition:transform .65s cubic-bezier(.22,1,.36,1)}
/* El mapa es una hoja: un filo tenue y una sombra lo despegan del fondo. */
#hoja{filter:drop-shadow(0 10px 26px #0a484233)}

/* Los iconos son los simbolos de punto: banos, primeros auxilios, comida...
   Van encima del mapa y por defecto NO reciben el toque, que sigue siendo de
   las zonas; si no, un icono plantado en medio de un estacionamiento se
   comeria la pulsacion de esa parte del estacionamiento.

   La excepcion son los que llevan informacion: esos si se tocan, porque al
   pulsarlos sale una ventana. Son pocos y pequenos, asi que lo que le quitan
   a la zona de debajo es un trozo minusculo a cambio de algo que se puede
   consultar.

   El aro claro los despega del pasto, que es una textura cargada y se come
   los trazos finos. El grosor va con vector-effect para que no engorde al
   ampliar: un icono ampliado 4x con el trazo escalado se ve como un garabato. */
#iconos{pointer-events:none}
#iconos .aro{fill:#fffffff2;stroke:#0a4842;stroke-opacity:.32;stroke-width:1.2;
             vector-effect:non-scaling-stroke}
#iconos .lam *{fill:none;stroke:var(--tinta);stroke-width:1.9;
               stroke-linecap:round;stroke-linejoin:round;
               vector-effect:non-scaling-stroke}
#iconos .lam .relleno{fill:var(--tinta);stroke:none}

/* Las imagenes propias ya vienen recortadas en circulo por el clipPath, asi
   que aqui no hay nada que hacer salvo que no se salgan del aro. */
#iconos .fig{pointer-events:none}

/* --- Sin circulo -----------------------------------------------------------
   Un icono puede ir sin el aro, solo con su dibujo. Es lo que conviene para
   una imagen que ya es redonda de por si, o para un simbolo que se lee mejor
   suelto.

   Quitarle el aro tiene un precio: las lineas finas se pierden sobre el pasto,
   que es una textura cargada. Se compensa con un halo blanco alrededor del
   trazo, hecho con drop-shadow en las cuatro direcciones. El halo es de la
   misma medida en unidades del mapa, asi que crece con el icono y no se
   convierte en una mancha al ampliar. */
#iconos .sinAro .lam{filter:drop-shadow(0 0 1.6px #fff) drop-shadow(0 0 1.6px #fff)}
/* Una imagen sin aro tampoco lleva el recorte en circulo: si se quita el
   circulo, se quita entero, y una foto sale como es. */
#iconos .sinAro .fig{clip-path:none}

/* Un icono con informacion se puede pulsar, y lo dice: se le marca el filo y
   sale la manita. Sin esa pista no hay forma de saber cuales llevan algo
   detras.

   El pointer-events hay que devolverselo uno por uno: el grupo de arriba lo
   tiene en `none` y eso lo heredan los hijos, asi que sin esta linea el icono
   seguiria sin recibir el toque por mucho cursor:pointer que tenga. */
#iconos .conInfo{pointer-events:auto;cursor:pointer}
#iconos .conInfo .aro{stroke:var(--verde);stroke-opacity:.55}
#iconos .conInfo:hover .aro,#iconos .conInfo:focus-visible .aro{
  stroke:var(--verde);stroke-opacity:1;stroke-width:2;fill:#fff}

/* --- Las animaciones -------------------------------------------------------
   Se aplican a un <g> INTERIOR, nunca al que lleva la posicion. En SVG el
   `transform` de CSS pisa al atributo `transform`, asi que animar el <g> de
   fuera borraria el translate que pone el icono en su sitio y todos se
   apilarian en la esquina.

   Se mueven transform y opacidad, que el navegador compone sin repintar, y
   son suaves a proposito: esto es un mapa, no un anuncio. `transform-box` y
   `transform-origin` hacen que giren y latan sobre su propio centro (el 0,0
   donde estan dibujados) y no sobre la esquina de la hoja.

   La INTENSIDAD va en la variable `--m`, que cada icono lleva puesta en su
   <g> de fuera (por defecto 1). Los keyframes la usan dentro de un calc(), asi
   que la misma animacion sirve para todos y cada uno se mueve lo suyo sin
   duplicar reglas. La variable se hereda, asi que ponerla en el <g> de fuera
   basta; y ahi es seguro porque un `style` con solo una variable no toca el
   atributo `transform` que lleva ese mismo elemento. */
#iconos .an{transform-box:fill-box;transform-origin:center}
#iconos .an.late{animation:icLate 2.4s ease-in-out infinite}
#iconos .an.flota{animation:icFlota 3.2s ease-in-out infinite}
#iconos .an.gira{animation:icGira 14s linear infinite}
#iconos .an.brilla{animation:icBrilla 2.6s ease-in-out infinite}
#iconos .an.ondas{animation:icOndas 2.6s ease-out infinite}
/* Vibra y viento van mas rapido que las otras a proposito: son las dos que
   imitan algo que se mueve solo, y a camara lenta no se reconocen. */
#iconos .an.vibra{animation:icVibra .22s linear infinite}
#iconos .an.viento{animation:icViento 3.4s ease-in-out infinite}

/* Un latido: crece y vuelve. */
@keyframes icLate{
  0%,100%{transform:scale(1)}
  50%{transform:scale(calc(1 + .1 * var(--m, 1)))}}
/* Sube y baja despacio. */
@keyframes icFlota{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(calc(-1.6px * var(--m, 1)))}}
/* Una vuelta completa. No tiene intensidad: no hay nada que ampliar, asi que
   el editor no ofrece el control para esta. */
@keyframes icGira{to{transform:rotate(360deg)}}
/* Aparece y desaparece. La opacidad la recorta el navegador al rango 0..1 por
   su cuenta, asi que con intensidad alta se queda en 0 un momento y ya esta. */
@keyframes icBrilla{
  0%,100%{opacity:1}
  50%{opacity:calc(1 - .58 * var(--m, 1))}}
/* Un anillo que se expande desde el icono y se desvanece, como un radar. La
   intensidad decide hasta donde llega: con poca, el anillo apenas asoma. */
@keyframes icOndas{
  0%{transform:scale(1);opacity:.55}
  70%{transform:scale(calc(1 + .9 * var(--m, 1)));opacity:0}
  100%{transform:scale(calc(1 + .9 * var(--m, 1)));opacity:0}}
/* Temblor: va y viene muy rapido y en diagonal, con un giro minimo. Cada paso
   empuja hacia un lado distinto para que no se lea como un balanceo. */
@keyframes icVibra{
  0%,100%{transform:translate(0,0) rotate(0)}
  12%{transform:translate(calc(-.5px * var(--m, 1)),calc(.15px * var(--m, 1)))
     rotate(calc(-1deg * var(--m, 1)))}
  25%{transform:translate(calc(.45px * var(--m, 1)),calc(-.2px * var(--m, 1)))
     rotate(calc(.9deg * var(--m, 1)))}
  37%{transform:translate(calc(-.35px * var(--m, 1)),calc(-.15px * var(--m, 1)))
     rotate(calc(-.7deg * var(--m, 1)))}
  50%{transform:translate(calc(.5px * var(--m, 1)),calc(.2px * var(--m, 1)))
     rotate(calc(1.1deg * var(--m, 1)))}
  62%{transform:translate(calc(-.4px * var(--m, 1)),calc(.1px * var(--m, 1)))
     rotate(calc(-.9deg * var(--m, 1)))}
  75%{transform:translate(calc(.3px * var(--m, 1)),calc(-.1px * var(--m, 1)))
     rotate(calc(.6deg * var(--m, 1)))}
  87%{transform:translate(calc(-.45px * var(--m, 1)),calc(.15px * var(--m, 1)))
     rotate(calc(-1.1deg * var(--m, 1)))}}
/* Viento: se inclina hacia un lado y vuelve, con una racha mas fuerte despues.
   Los tiempos no son simetricos a proposito; una racha pareja se lee como un
   mecanismo y no como aire. */
@keyframes icViento{
  0%,100%{transform:rotate(0) translateX(0)}
  18%{transform:rotate(calc(3.5deg * var(--m, 1)))
     translateX(calc(.7px * var(--m, 1)))}
  42%{transform:rotate(calc(1.2deg * var(--m, 1)))
     translateX(calc(.25px * var(--m, 1)))}
  66%{transform:rotate(calc(5deg * var(--m, 1)))
     translateX(calc(1px * var(--m, 1)))}
  84%{transform:rotate(calc(2deg * var(--m, 1)))
     translateX(calc(.4px * var(--m, 1)))}}

/* El anillo que se expande en las ondas. Va con el trazo del color de la
   tinta y sin relleno, para que se lea como una onda y no como un aro solido. */
#iconos .onda{fill:none;stroke:var(--verde);stroke-width:1.6;stroke-opacity:.9;
              vector-effect:non-scaling-stroke}

/* Los colores del sistema tambien valen aqui: si alguien pide menos
   movimiento en su telefono, los iconos se quedan quietos. */
@media (prefers-reduced-motion:reduce){
  #iconos .an{animation:none}
}

/* --- La ventana de informacion ---------------------------------------------
   Mismo lenguaje que el panel: mismo fondo, mismo filo, mismo radio y el
   verde institucional. Sale del centro hacia arriba y desaparece sin dejar
   rastro, para que se vea que es algo que se abre encima del mapa y no una
   pantalla aparte.

   En el movil se pega abajo y ocupa el ancho: una ventana centrada obliga a
   acertarle con el dedo al boton de cerrar, y de paso asi se lee mejor. */
#ventana{position:fixed;inset:0;z-index:9;display:grid;place-items:end center;
         padding:16px;background:#0a484233;opacity:0;
         transition:opacity .22s ease;pointer-events:none}
#ventana.abierta{opacity:1;pointer-events:auto}
#ventana[hidden]{display:none}
#cajaVentana{width:100%;max-width:420px;max-height:min(78vh,560px);overflow-y:auto;
             background:var(--papel);border:1px solid var(--borde);
             border-radius:20px;padding:20px;
             box-shadow:0 24px 60px #0a484240;scrollbar-width:none;
             transform:translateY(14px) scale(.985);
             transition:transform .26s cubic-bezier(.22,1,.36,1)}
#cajaVentana::-webkit-scrollbar{display:none}
#ventana.abierta #cajaVentana{transform:none}
#cierraVentana{float:right;width:34px;height:34px;margin:-6px -6px 0 10px;
               border:1px solid var(--borde);border-radius:99px;background:#fff;
               display:grid;place-content:center;cursor:pointer;
               transition:background .2s ease,border-color .2s ease}
#cierraVentana:hover{background:var(--lima);border-color:#8fbf9a}
#cierraVentana svg{width:15px;height:15px;display:block}
#selloVentana{display:flex;align-items:center;gap:14px;margin-bottom:14px}
#selloVentana svg{width:52px;height:52px;flex:none;border-radius:14px;
                  background:var(--crema);padding:9px}
#selloVentana svg *{fill:none;stroke:var(--tinta);stroke-width:1.9;
                    stroke-linecap:round;stroke-linejoin:round}
#selloVentana svg .relleno{fill:var(--tinta);stroke:none}
#selloVentana img{width:52px;height:52px;flex:none;border-radius:50%;
                  border:1px solid var(--borde);object-fit:cover}
#tVentana{font-size:19px;font-weight:780;letter-spacing:-.015em;line-height:1.25;
          color:var(--tinta)}
#xVentana{font-size:14px;line-height:1.6;color:var(--texto);white-space:pre-line;
          margin:0}
#pieVentana{margin-top:18px;padding-top:14px;border-top:1px solid var(--borde);
            font-size:11px;font-weight:650;letter-spacing:.1em;
            text-transform:uppercase;color:var(--tenue)}

@media (min-width:760px) and (orientation:landscape){
  #ventana{place-items:center}
  #cajaVentana{transform:translateY(10px) scale(.97)}
}

/* Al tocar, solo se hace zoom. Las zonas no se resaltan ni se oscurece el
   resto del mapa: el diseno de Illustrator ya se lee solo y cualquier
   adorno encima lo ensucia. */

#cab{position:fixed;top:0;left:0;right:0;z-index:2;padding:16px 20px 30px;
     display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
     pointer-events:none;background:linear-gradient(#f3f9eeff,#f3f9ee00)}
#marca{font-size:16px;font-weight:800;letter-spacing:.02em;color:var(--tinta)}
#lugar{font-size:11px;font-weight:650;letter-spacing:.13em;text-transform:uppercase;
       color:var(--tenue)}

/* El panel lleva los accesos rapidos: en el movil acertarle a una banda
   diagonal es dificil, asi que ademas de informar sirve para navegar.

   Llevaba un backdrop-filter con desenfoque de 14 px que se quito: con el
   fondo al 97% de opacidad (#f3f9eef7) no se veia nada de lo de detras, y
   en cambio obligaba a recalcular el desenfoque en CADA fotograma del zoom,
   porque debajo hay un mapa que se esta moviendo. Pagaba un precio alto por
   un efecto invisible. */
#ficha{position:fixed;z-index:2;display:flex;flex-direction:column;gap:12px;
       padding:14px 16px;border:1px solid var(--borde);border-radius:18px;
       background:#f3f9eef7;
       box-shadow:0 16px 40px #0a484226;pointer-events:none;
       left:14px;right:14px;bottom:14px;
       transition:box-shadow .35s ease,border-color .35s ease}
#ficha.on{border-color:#179e68aa;box-shadow:0 16px 40px #0a484226,0 0 0 1px #179e6833}
#rotulo{display:flex;align-items:center;gap:14px}
#punto{flex:none;width:50px;height:50px;border-radius:13px;display:grid;
       place-content:center;background:var(--lima);color:#0d3b34;
       transition:background .35s ease,color .35s ease,box-shadow .35s ease}
#ficha.on #punto{background:var(--tinta);color:#fff;box-shadow:0 0 22px #179e6866}
#lupa{width:24px;height:24px;display:block}
#titulo{display:block;font-size:17px;font-weight:750;letter-spacing:-.01em;
        line-height:1.25;color:var(--tinta)}
#pista{display:block;font-size:12.5px;color:var(--tenue);margin-top:3px}

#chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
       -webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border:1px solid var(--borde);border-radius:99px;
      background:#fff;color:#2c4f47;font:650 12.5px/1 system-ui,sans-serif;
      cursor:pointer;white-space:nowrap;pointer-events:auto;
      transition:border-color .25s ease,background .25s ease,color .25s ease}
.chip:hover{border-color:#8fbf9a}
.chip.act{border-color:var(--tinta);background:var(--tinta);color:#fff}

/* Debajo de los accesos rapidos va el enlace de fuera: el programa del
   evento, que vive en el ownCloud de la UABC. Es otra cosa que los chips de
   arriba (aquellos llevan a una zona del mapa; este sale del mapa), asi que
   va separado con un filo y con un boton lleno del verde institucional, que
   no se confunde con el chip activo.

   Lleva el icono de salir a otro sitio porque abre en pestana nueva: sin esa
   pista, que el mapa no cambie al pulsar desconcierta. */
#enlaces{display:flex;flex-wrap:wrap;gap:8px;padding-top:13px;
         border-top:1px solid var(--borde)}
.enlace{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;
        border-radius:99px;background:var(--verde);color:#fff;
        text-decoration:none;font:700 12.5px/1 system-ui,sans-serif;
        white-space:nowrap;pointer-events:auto;
        transition:background .25s ease,box-shadow .25s ease}
.enlace:hover{background:#005c33;box-shadow:0 6px 18px #00723f4d}
.enlace:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.enlace svg{width:14px;height:14px;flex:none;opacity:.85}

/* En pantalla ancha el panel pasa a lateral: una barra inferior desperdicia
   el ancho sobrante y deja el mapa chico y centrado.

   Va anclado de arriba a abajo en vez de centrado con translateY. Centrado
   funcionaba con las seis filas de chips de antes, pero un movil acostado
   tiene unos 360 px de alto: en cuanto el panel crece un poco se sale por
   los dos lados, y lo primero que se pierde es el boton del programa, que va
   al final. Anclado y con scroll propio, siempre se alcanza.

   Aqui si puede recibir el toque (en vertical no, para no comerse el mapa):
   el encuadre deja el mapa a la derecha del panel, asi que debajo no hay
   mapa que se pierda y en cambio hace falta para poder desplazar la lista.

   La barra de desplazamiento va oculta, como la de los chips: es un menu,
   no un documento, y el filo gris al lado del mapa afea. El desplazamiento
   sigue funcionando. */
@media (min-width:760px) and (orientation:landscape){
  #ficha{left:22px;right:auto;top:14px;bottom:14px;width:330px;
         transform:none;overflow-y:auto;pointer-events:auto;
         padding:20px;border-radius:20px;scrollbar-width:none}
  #ficha::-webkit-scrollbar{display:none}
  #chips{flex-wrap:wrap;overflow:visible}
  #enlaces{margin-top:auto}
  #enlaces .enlace{flex:1;justify-content:center}
}
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1224 792" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="recorte"><circle cx="0" cy="0" r="12.2"/></clipPath>
  </defs>
  <g id="m">
    <g id="hoja">
      <rect x="0" y="0" width="1224" height="792" fill="#f3f9ee"/>
      <image href="rectoria.webp" x="0" y="0" width="1224" height="792"
             preserveAspectRatio="none"/>
      <rect x="1" y="1" width="1222" height="790" fill="none"
            stroke="#b8d4bb" stroke-width="2"/>
    </g>
    <g id="zonas"></g>
    <g id="iconos"></g>
  </g>
</svg>

<header id="cab"><span id="marca">Día del Orgullo Cimarrón 2026</span>
<span id="lugar">Rectoría UABC · Mexicali, B.C.</span></header>
<footer id="ficha">
  <div id="rotulo">

           stroke-width="2.2" stroke-linecap="round">

      </svg>
    </span>

    <span id="pista">Toca una zona para acercarla</span></div>
  </div>
  <div id="chips"></div>

    <a class="enlace" href="https://owncloud.rec.uabc.mx/index.php/s/AWUxeuZCv9XdTPI"
       target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        <path d="M18 14.5v5A1.5 1.5 0 0 1 16.5 21h-12A1.5 1.5 0 0 1 3 19.5v-12A1.5 1.5 0 0 1 4.5 6h5"/>
      </svg>Programa del evento</a>

<!-- La ventana que sale al tocar un icono con informacion. Es una sola para
     todos los iconos: se cambia su contenido y se muestra, en vez de tener
     una por icono. Con una sola no hay forma de que queden dos abiertas ni
     de que se acumulen en el DOM.

     Empieza en `hidden`, que ademas de esconderla la saca del alcance del
     teclado: con solo opacidad, el boton de cerrar seguiria siendo tabulable
     y el foco se iria a un sitio invisible. -->
<div id="ventana" hidden>
  <div id="cajaVentana" role="dialog" aria-modal="true" aria-labelledby="tVentana">
    <button id="cierraVentana" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0a4842" stroke-width="2.4"
           stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="selloVentana" aria-hidden="true"></div>
    <strong id="tVentana"></strong>
    <p id="xVentana"></p>
    <div id="pieVentana">Día del Orgullo Cimarrón 2026</div>
  </div>
</div>

<script>
// ===========================================================================
// Zonas interactivas, trazadas sobre el mapa de Illustrator.
//
// El mapa mide 1224 x 792 pt (432 x 279 mm) y todo se define en ese mismo
// espacio de coordenadas, que es el que usa el viewBox. Asi los numeros de
// aqui se leen directamente sobre el archivo de Illustrator.
//
// Cada zona es [nombre, nombre corto, poligono, descripcion]. La caja que se
// encuadra al hacer zoom NO se guarda aparte: se calcula del poligono. Tener
// los dos datos a mano era pedir que se desincronizaran, y de hecho paso:
// ajuste los poligonos y las cajas se quedaron viejas, asi que el zoom
// dejaba parte de la zona fuera de cuadro.
//
// Las bandas diagonales (estacionamientos y zonas de stands) van como
// cuadrilateros que siguen la banda. Un rectangulo normal las cubriria mal:
// al ir en diagonal, su caja incluiria medio prado.
//
// Dos zonas no pueden solaparse: al tocar caeria la de encima y la otra
// quedaria inalcanzable justo ahi. Hay una prueba que lo comprueba con los

// Como se llama cada simbolo cuando el icono no lleva etiqueta propia. Es lo
// que sale en el <title> del icono, que es lo que leen los lectores de
// pantalla y lo que se ve al dejar el raton encima.
//
// Va aparte del bloque de arriba a proposito: SIMBOLOS lo reescribe el editor
// y esto no, porque los nombres son los mismos para todos los mapas.
//
// Tienen que ser los mismos que los de la lista SIMBOLOS de editor/validar.py.
// Hay una prueba que compara las dos listas, nombres incluidos: si se separan,
// un icono acabaria anunciandose como «bano» en vez de «Baños».
var NOMBRES = {
  bano: "Baños", primeros: "Primeros auxilios", comida: "Alimentos",
  bebida: "Bebidas", escenario: "Escenario", entrada: "Entrada",
  informacion: "Información", auto: "Estacionamiento", agua: "Agua",
  basura: "Basura", sonido: "Audio", estrella: "Punto de interés"
};

// Cuanto mide un icono por defecto, en unidades del mapa y no en pixeles:
// los iconos son parte del plano y crecen con el zoom igual que las calles.
// Cada icono puede llevar su propio tamano; este es el que se usa cuando no
// lo lleva.
var TAM_ICONO = 46;

var s = document.getElementById("s"), M = document.getElementById("m"),
    cab = document.getElementById("cab"), F = document.getElementById("ficha"),
    TITULO = document.getElementById("titulo"), PISTA = document.getElementById("pista"),
    PUNTO = document.getElementById("punto"), ZON = document.getElementById("zonas"),
    ICN = document.getElementById("iconos"),
    CH = document.getElementById("chips"), K = [], A = -1, i;

// Un texto que va a acabar dentro del SVG. Las etiquetas de los iconos las
// escribe una persona, asi que pueden traer un & o un < y romper el dibujo.
function escapa(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Los poligonos son transparentes: existen solo para recibir el toque, sin
// dibujar nada encima del arte del mapa.
ZON.innerHTML = ZONAS.map(function (z, k) {
  return '<polygon class="g" data-i="' + k + '" points="'
       + z[2].map(function (p) { return p.join(",") }).join(" ")
       + '" fill="transparent"/>';
}).join("");
CH.innerHTML = ZONAS.map(function (z, k) {
  return '<button class="chip" data-i="' + k + '">' + z[1] + "</button>";
}).join("");
K = CH.querySelectorAll(".chip");
var G = ZON.querySelectorAll(".g");

// La forma de un icono: el dibujo del simbolo, o la imagen propia. Vacio si
// el tipo no existe, que es lo que hace que un icono desconocido se salte en
// vez de salir como un hueco.
//
// El recorte en circulo de las imagenes y el aro van juntos: si el icono va
// sin circulo, la imagen tambien pierde el recorte y sale como es. Media
// medida (aro fuera, recorte dentro) dejaria la imagen redonda sin nada que
// lo explique.
function figuraDe(tipo, conAro) {
  if (SIMBOLOS[tipo]) return '<g class="lam">' + SIMBOLOS[tipo] + "</g>";
  if (PROPIOS[tipo]) {
    return '<image class="fig" href="' + PROPIOS[tipo]
         + '" x="-12.2" y="-12.2" width="24.4" height="24.4"'
         + (conAro ? ' clip-path="url(#recorte)"' : "") + "/>";
  }
  return "";
}

// Como se llama un icono cuando no lleva etiqueta propia.
function nombreDe(tipo) {
  return NOMBRES[tipo] || tipo;
}

// Los iconos, encima del mapa. Uno con un tipo que no exista se salta en vez
// de dibujar un hueco: mejor un icono de menos que un circulo vacio que nadie
// sabe de donde sale.
//
// El transform lleva tres cosas, y el orden importa: translate al sitio, scale
// al tamano y rotate para girarlo. La rotacion va la ultima para que gire sobre
// su propio centro (el 0,0 donde esta dibujado), que es lo que uno espera al
// girar un icono. Si fuera antes del scale, giraria sobre un centro ya escalado
// y se iria del sitio.
ICN.innerHTML = ICONOS.map(function (ic, k) {
  // `c` en 0 es "sin circulo". Se comprueba asi y no por lo que valga, porque
  // 0 es un valor legitimo y un `if (!ic.c)` lo confundiria con la ausencia.
  var conAro = !("c" in ic) || !!ic.c;
  var dentro = figuraDe(ic.t, conAro);
  if (!dentro) return "";

  // El <g> de dentro es el que anima. El de fuera lleva la posicion y no se
  // puede tocar: en SVG el transform de CSS pisa al atributo transform, asi
  // que animar el de fuera mandaria el icono a la esquina de la hoja.
  var clase = "an" + (ic.a ? " " + ic.a : "");
  var ondas = ic.a === "ondas" ? '<circle class="onda" r="13.4"/>' : "";
  var clases = "ic" + (conAro ? "" : " sinAro") + (ic.i ? " conInfo" : "");
  var caja = ic.i ? ' class="' + clases + '" data-info="' + k + '"'
                  : ' class="' + clases + '"';
  // La intensidad del movimiento va en un `style` con solo la variable, para
  // que no pise el atributo `transform` de este mismo elemento, que es el que
  // pone el icono en su sitio. Se omite cuando vale 1, que es lo normal.
  var fuerza = (ic.m && ic.m !== 1) ? ' style="--m:' + ic.m + '"' : "";
  // La comilla que cierra el transform va al principio del ultimo trozo. Es
  // facil dejarla fuera (paso dos veces) y el navegador se traga la etiqueta
  // entera: el icono desaparece y solo sale un aviso en la consola.
  return "<g" + caja + fuerza + ' transform="translate(' + ic.x + "," + ic.y
       + ") scale(" + ((ic.s || TAM_ICONO) / 24) + ")"
       + (ic.r ? " rotate(" + ic.r + ")" : "") + '"><title>'
       + escapa(ic.n || nombreDe(ic.t)) + "</title>"
       + (conAro ? '<circle class="aro" r="13.4"/>' : "")
       + '<g class="' + clase + '">'
       + ondas + dentro + "</g></g>";
}).join("");

// desincronizaran, y paso: al ajustar los poligonos las cajas se quedaron
// viejas y el zoom dejaba parte de la zona fuera de cuadro. Hay una prueba
// que comprueba que cada caja cubra su poligono.
function caja(puntos) {
  var xs = [], ys = [], p;
  for (var j = 0; j < puntos.length; j++) {
    p = puntos[j];
    xs.push(p[0]);
    ys.push(p[1]);
  }
  var x = Math.min.apply(null, xs), y = Math.min.apply(null, ys);
  return [x, y, Math.max.apply(null, xs) - x, Math.max.apply(null, ys) - y];
}

// Coloca el dibujo para que el rectangulo [x,y,ancho,alto] quepa centrado en
// el hueco libre que dejan el encabezado y el panel, ampliandolo lo posible.
//
// Es un transform CSS sobre el <g>, no un viewBox animado: asi el navegador lo
// interpola solo y no hace falta ningun bucle en JS.
//
// Tres detalles que importan:
//  - getScreenCTM() del <svg> (que nunca se transforma) trae dos escalas
//    distintas, c.a para el eje X y c.d para el Y. Usar c.a en los dos ejes
//    descentra la vista.
//  - El centro util es el del hueco, no el del svg: si se centra en el svg,
//    la zona ampliada queda tapada por el panel o por el encabezado.
//  - El panel es barra inferior en vertical y lateral en apaisado, asi que el
//    hueco se mide de sus rectangulos en vez de suponer donde esta.
function encuadra(x, y, w, h, aire) {
  var c = s.getScreenCTM(), ux = c.a, uy = c.d,
      W = s.clientWidth, H = s.clientHeight,
      rc = cab.getBoundingClientRect(), rf = F.getBoundingClientRect(),
      lateral = rf.width < W * .62,
      arriba = rc.bottom,
      izq = lateral ? rf.right + 12 : 0,
      abajo = lateral ? 0 : H - rf.top,
      ancho = W - izq, alto = H - arriba - abajo,
      k = Math.min(ancho / (ux * w * aire), alto / (uy * h * aire)),
      cx = izq + ancho / 2, cy = arriba + alto / 2;
  M.style.transform = "translate(" + ((cx - c.e) / ux - k * (x + w / 2)) + "px,"
    + ((cy - c.f) / uy - k * (y + h / 2)) + "px) scale(" + k + ")";
}

function pinta(k) {
  A = k;
  for (var j = 0; j < K.length; j++) K[j].classList.toggle("act", j == k);
}

function sel(k) {
  var z = ZONAS[k], c = caja(z[2]);
  pinta(k);
  TITULO.textContent = z[0];
  PISTA.textContent = z[3];
  F.classList.add("on");
  encuadra(c[0], c[1], c[2], c[3], 1.14);
}

function todo() {
  pinta(-1);
  TITULO.textContent = "Mapa del evento";
  PISTA.textContent = "Toca una zona para acercarla";
  F.classList.remove("on");
  encuadra(VISTA[0], VISTA[1], VISTA[2], VISTA[3], 1.04);
}

// --- La ventana de informacion ---------------------------------------------
// Al tocar un icono con informacion sale una ventana con su titulo y su
// texto. Es la misma ventana para todos: se cambia el contenido y se muestra.
var VENT = document.getElementById("ventana"),
    SELLO = document.getElementById("selloVentana"),
    TVENT = document.getElementById("tVentana"),
    XVENT = document.getElementById("xVentana"),
    CVENT = document.getElementById("cierraVentana");

function abreVentana(k) {
  var ic = ICONOS[k];
  if (!ic || !ic.i) return;
  TVENT.textContent = ic.i[0];
  XVENT.textContent = ic.i[1];
  // La miniatura se dibuja con la misma figura que el icono del mapa, para
  // que se vea de cual se trata. El SVG se arma aqui y no se copia del mapa
  // porque alli el icono lleva el transform de la posicion, y copiarlo tal
  // cual lo dejaria fuera de la caja.
  var esPropio = !SIMBOLOS[ic.t] && !!PROPIOS[ic.t];
  // Se le pasa conAro = true siempre: en la ventana la imagen va dentro de un
  // cuadro cuadrado y el recorte en circulo es lo que la hace encajar. Si se
  // copiara el "sin circulo" del mapa, una foto saldria con las esquinas
  // pegadas a un marco que no es el suyo.
  SELLO.innerHTML = esPropio
    ? '<img src="' + PROPIOS[ic.t] + '" alt="">'
    : '<svg viewBox="-13 -13 26 26">' + figuraDe(ic.t, true) + "</svg>";
  SELLO.setAttribute("aria-hidden", "true");
  VENT.hidden = false;
  // Un fotograma con `hidden` ya quitado antes de poner la clase, o el
  // navegador no ve el cambio de estado y la ventana aparece de golpe sin
  // transicion.
  requestAnimationFrame(function () { VENT.classList.add("abierta") });
  CVENT.focus({preventScroll: true});
}

function cierraVentana() {
  if (VENT.hidden) return;
  VENT.classList.remove("abierta");
  // Se espera a que termine la transicion para volver a esconderla. Si se
  // esconde antes, desaparece de golpe; y si se deja visible, el fondo sigue
  // interceptando el toque y el mapa deja de responder.
  setTimeout(function () {
    if (!VENT.classList.contains("abierta")) VENT.hidden = true;
  }, 240);
}

CVENT.addEventListener("click", cierraVentana);
// Tocar el fondo tambien cierra. Se compara contra el propio fondo y no
// contra la caja, para que un clic dentro del texto no la cierre.
VENT.addEventListener("pointerdown", function (e) {
  if (e.target === VENT) cierraVentana();
});
addEventListener("keydown", function (e) {
  if (e.key === "Escape") cierraVentana();
});

// Un icono con informacion se toca. El toque no puede llegar al <svg>, que
// es el que hace el zoom: si llegara, ademas de abrir la ventana se
// desharia el zoom por detras. Por eso se corta en el pointerdown, que es
// cuando el <svg> escucha.
ICN.addEventListener("pointerdown", function (e) {
  if (e.target.closest(".conInfo")) e.stopPropagation();
});
ICN.addEventListener("click", function (e) {
  var g = e.target.closest("[data-info]");
  if (g) abreVentana(+g.dataset.info);
});

// Si ya hay una zona ampliada, cualquier toque deshace el zoom, toque donde
// toque: al ampliar, la zona ocupa casi toda la pantalla y no queda fondo
// donde pulsar.
s.addEventListener("pointerdown", function (e) {
  if (A >= 0) return todo();
  var g = e.target.closest(".g");
  if (g) sel(+g.dataset.i);
});
CH.addEventListener("click", function (e) {
  var c = e.target.closest(".chip");
  if (c) sel(+c.dataset.i);
});

// El encuadre depende del alto del encabezado y del panel, que cambian al
// girar el movil o al cruzar el punto donde el panel pasa a lateral.
addEventListener("resize", function () { A >= 0 ? sel(A) : todo() });
// El mapa tarda un poco en cargar: hasta que no este, el <svg> no tiene
// tamano real y el encuadre saldria mal.
var IMG = s.querySelector("image");
if (IMG && !IMG.complete) IMG.addEventListener("load", todo);
todo();
</script>

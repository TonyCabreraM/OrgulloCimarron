<!doctype html>
<html lang=es>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
body{height:100dvh;overflow:hidden;background:#0e151b;color:#e8f1f8;
font:15px/1.35 system-ui,sans-serif;touch-action:none}
#s{position:fixed;inset:0;width:100%;height:100%}
#m{transform-box:view-box;transform-origin:0 0;transition:transform .55s}
.z{fill:#24425c;stroke:#0b1218;stroke-width:3;transition:.25s}
.n{fill:#d5e6f5;font-size:30px;font-weight:800;text-anchor:middle}
.act .z{fill:#f2a541;stroke:#8a4f05}
.act .n{fill:#241704}
#h{position:fixed;left:0;right:0;bottom:0;padding:14px 18px 18px;pointer-events:none;
background:#0e151be6}
b,s{display:block}
b{color:#f2a541;font-size:20px}s{font-size:13px}
</style>
</head>
<body>
<svg id=s viewBox="0 0 1000 850"><g id=m></g></svg>
<div id=h><b id=t>UABC Campus Mexicali</b><s id=d>Toca un edificio</s></div>
<script>
// Trazado sobre el croquis oficial "Mapa: Ubicacion de Edificios" (UABC
// Mexicali). Cada zona es [sigla, x, y, ancho, alto] en el lienzo 1000x850.
// Al llegar el SVG de Illustrator solo cambian estas cajas y las firmas.
//
// Se usa un array literal y no un texto partido con split(): al concatenar
// varios textos con '+', el .split() solo se aplicaria al ultimo trozo y Z
// volveria a ser una cadena, con lo que Z[i] seria un caracter suelto y
// todas las coordenadas saldrian NaN (fallo silencioso, sin error).
// OJO: la Rectoria UABC no esta aqui. Vive en la Col. Nueva, entre Leyes de
// la Reforma y Sebastian Lerdo de Tejada (ex Palacio de Gobierno). Esto es el
// campus de Blvd. Benito Juarez 2500.
var Z=[["A",654,599,115,106],["1-4",311,332,131,131],["E",808,464,77,48],
["V",202,483,202,78],["T",461,87,135,184],["BIB",690,440,100,150]],
D=["Fac. Ingenieria","Fac. Derecho","Fac. Arq. y Diseno","Investigacion y Posgrado","Teatro","Biblioteca"],
s=document.getElementById("s"),M=document.getElementById("m"),
h=document.getElementById("h"),t=document.getElementById("t"),
d=document.getElementById("d"),G=[],A=0,i,m;

// Fondo: perimetro, areas verdes, vias internas y estacionamientos.
//
// OJO con el espacio antes de '/>' en todos los atributos sin comillas: en
// HTML, un valor sin comillas se traga la '/', asi que 'fill=#16241c/>' se
// parsea como fill="#16241c/" y la etiqueta nunca se cierra, tragandose
// todo el dibujo. El espacio es lo que termina el valor. Hay una prueba que
// detecta este patron.
m='<rect width=1000 height=850 fill=#16241c />'
 +'<path d="M60 60H960V820H60Z" fill=#1b3a2c stroke=#0f1922 stroke-width=4 />'
 +'<path d="M170 470H960M480 90V810M700 420V810M60 350H300" stroke=#38485a stroke-width=20 />'
 +'<path d="M150 90h180v190H150ZM700 90h130v190H700Z" fill=#3a4a5c />';

for(i=0;i<Z.length;i++){
  var b=Z[i],x=b[1],y=b[2],w=b[3],q=b[4];
  m+='<g class="g" data-i="'+i+'"><rect class="z" x='+x+' y='+y+' width='+w+' height='+q+' rx=6 />'
   +'<text class="n" x='+(x+w/2)+' y='+(y+q/2)+' dy=.36em>'+b[0]+'</text></g>';
}
M.innerHTML=m;
// OJO: .children incluiria tambien los rect y path del fondo, y G[i] se
// desplazaria. Se seleccionan solo los grupos de las zonas.
G=M.querySelectorAll(".g");

// El zoom es un transform CSS sobre el <g>, no un viewBox animado: asi el
// navegador lo interpola solo y no hace falta ningun bucle en JS.
// Se usa getScreenCTM del <svg> (nunca se transforma) para saber a que
// pixel corresponde cada unidad del dibujo, y el centro util es el de la
// zona de arriba, porque la ficha de abajo tapa la parte baja.
function ver(i){
  var b=Z[i],x=b[1],y=b[2],w=b[3],q=b[4],
  W=s.clientWidth,H=s.clientHeight,c=s.getScreenCTM(),u=c.a,
  vh=h.offsetHeight,vy=((H-vh)/2-c.f)/u,
  k=Math.min(W/(u*w*1.3),(H-vh)/(u*q*1.3));
  M.style.transform="translate("+((W/2-c.e)/u-k*(x+w/2))+"px,"+(vy-k*(y+q/2))+"px) scale("+k+")";
}

function pinta(i){
  if(A)A.classList.remove("act");
  A=G[i];if(A)A.classList.add("act");
}
function sel(i){
  pinta(i);
  t.textContent=Z[i][0]+" · "+D[i];
  d.textContent="Toca el fondo para volver";
  ver(i);
}
function todo(){
  pinta(-1);
  t.textContent="UABC Campus Mexicali";
  d.textContent="Toca un edificio";
  M.style.transform="none";
}

s.addEventListener("pointerdown",function(e){
  var g=e.target.closest(".g");
  g?sel(+g.dataset.i):todo();
});
</script>
</body>
</html>

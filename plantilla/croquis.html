<style>
:root{
  --papel:#f3f9ee; --fondo:#dfeada; --tinta:#0a4842; --pasto:#179e68;
  --lima:#80c458; --crema:#d6edce; --texto:#0d3b34; --tenue:#4d6d64; --borde:#b8d4bb;
  --verde:#00723f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background-color:var(--fondo);
  background-image:
    radial-gradient(58% 46% at 8% 0%,#179e6820,transparent 65%),
    radial-gradient(52% 44% at 94% 100%,#80c45826,transparent 65%),
    radial-gradient(#c2d9c4 1.3px,transparent 1.4px);
  background-size:auto,auto,26px 26px;
  background-attachment:fixed;
  color:var(--texto);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  touch-action:none;-webkit-tap-highlight-color:transparent;
}
#s{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}



#m{transform-box:view-box;transform-origin:0 0;

   transition:transform .3s cubic-bezier(.22,1,.36,1)}
#m.acercando{will-change:transform}



#iconos{pointer-events:none}
#iconos .aro{fill:#fffffff2;stroke:#0a4842;stroke-opacity:.32;stroke-width:1.2;
             vector-effect:non-scaling-stroke}
#iconos .lam *{fill:none;stroke:var(--tinta);stroke-width:1.9;
               stroke-linecap:round;stroke-linejoin:round;
               vector-effect:non-scaling-stroke}
#iconos .lam .relleno{fill:var(--tinta);stroke:none}


#iconos .fig{pointer-events:none}


#iconos .sinAro .lam{filter:drop-shadow(0 0 1.6px #fff) drop-shadow(0 0 1.6px #fff)}

#iconos .sinAro .fig{clip-path:none}



#iconos .conInfo{cursor:pointer}
#iconos.deCerca .conInfo{pointer-events:auto}
#iconos.deCerca .conInfo .aro{stroke:var(--verde);stroke-opacity:.55}
#iconos.deCerca .conInfo:hover .aro,
#iconos.deCerca .conInfo:focus-visible .aro{
  stroke:var(--verde);stroke-opacity:1;stroke-width:2;fill:#fff}


#iconos .toque{fill:none;pointer-events:fill}


#iconos .an{transform-box:fill-box;transform-origin:center}
#iconos .an.late{animation:icLate 2.4s ease-in-out infinite}
#iconos .an.flota{animation:icFlota 3.2s ease-in-out infinite}
#iconos .an.gira{animation:icGira 14s linear infinite}
#iconos .an.brilla{animation:icBrilla 2.6s ease-in-out infinite}
#iconos .an.ondas{animation:icOndas 2.6s ease-out infinite}

#iconos .an.vibra{animation:icVibra .22s linear infinite}

#iconos .an.viento{animation:icViento 3.4s ease-in-out infinite;
                   transform-origin:50% 100%}





@keyframes icLate{
  0%,100%{transform:scale(1)}
  50%{transform:scale(calc(1 + .1 * var(--m, 1)))}}

@keyframes icFlota{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(calc(-1.6px * var(--m, 1)))}}

@keyframes icGira{to{transform:rotate(360deg)}}

@keyframes icBrilla{
  0%,100%{opacity:1}
  50%{opacity:calc(1 - .58 * var(--m, 1))}}

@keyframes icOndas{
  0%{transform:scale(1);opacity:.55}
  70%{transform:scale(calc(1 + .9 * var(--m, 1)));opacity:0}
  100%{transform:scale(calc(1 + .9 * var(--m, 1)));opacity:0}}

@keyframes icVibra{
  0%,100%{transform:translate(0,0) rotate(0)}
  12%{transform:translate(calc(-.5px * var(--m, 1)),calc(.15px * var(--m, 1)))
     rotate(calc(-1deg * var(--m, 1)))}
  25%{transform:translate(calc(.45px * var(--m, 1)),calc(-.2px * var(--m, 1)))
     rotate(calc(.9deg * var(--m, 1)))}
  37%{transform:translate(calc(-.35px * var(--m, 1)),calc(-.15px * var(--m, 1)))
     rotate(calc(-.7deg * var(--m, 1)))}
  50%{transform:translate(calc(.5px * var(--m, 1)),calc(.2px * var(--m, 1)))
     rotate(calc(1.1deg * var(--m, 1)))}
  62%{transform:translate(calc(-.4px * var(--m, 1)),calc(.1px * var(--m, 1)))
     rotate(calc(-.9deg * var(--m, 1)))}
  75%{transform:translate(calc(.3px * var(--m, 1)),calc(-.1px * var(--m, 1)))
     rotate(calc(.6deg * var(--m, 1)))}
  87%{transform:translate(calc(-.45px * var(--m, 1)),calc(.15px * var(--m, 1)))
     rotate(calc(-1.1deg * var(--m, 1)))}}

@keyframes icViento{
  0%,100%{transform:rotate(0) skewX(0)}
  20%{transform:rotate(calc(3.2deg * var(--m, 1)))
     skewX(calc(-2.2deg * var(--m, 1)))}
  40%{transform:rotate(calc(1.2deg * var(--m, 1)))
     skewX(calc(-0.8deg * var(--m, 1)))}
  62%{transform:rotate(calc(5.5deg * var(--m, 1)))
     skewX(calc(-3.6deg * var(--m, 1)))}
  84%{transform:rotate(calc(2deg * var(--m, 1)))
     skewX(calc(-1.3deg * var(--m, 1)))}}


#iconos .onda{fill:none;stroke:var(--verde);stroke-width:1.6;stroke-opacity:.9;
              vector-effect:non-scaling-stroke}




#zonas .g{stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}

#zonas .g.punteada{stroke-dasharray:3 4}


#zonas .g{animation:var(--az, none), var(--ab, none)}
#zonas .g.za-late{--az:zonaLate 3s ease-in-out infinite}
#zonas .g.za-brilla{--az:zonaBrilla 2.8s ease-in-out infinite}
#zonas .g.za-destello{--az:zonaDestello 4s ease-out infinite}

#zonas .g.zb-camina{
  stroke-dasharray:calc(9 * var(--m, 1) * 1px) calc(7 * var(--m, 1) * 1px);
  --ab:bordeCamina 1.6s linear infinite}

#zonas .g.zb-camina.zd-reves{--ab:bordeCamina 1.6s linear infinite reverse}
#zonas .g.zb-late{--ab:bordeLate 3s ease-in-out infinite}
#zonas .g.zb-brilla{--ab:bordeBrilla 2.8s ease-in-out infinite}


@keyframes zonaLate{
  0%,100%{opacity:1}
  50%{opacity:calc(1 - .45 * var(--m, 1))}}

@keyframes zonaBrilla{
  0%,100%{opacity:1}
  50%{opacity:0}}

@keyframes zonaDestello{
  0%,12%,100%{opacity:1}
  5%{opacity:calc(1 - .75 * var(--m, 1))}}
@keyframes bordeLate{
  0%,100%{stroke-opacity:.95}
  50%{stroke-opacity:calc(.95 - .6 * var(--m, 1))}}
@keyframes bordeBrilla{
  0%,100%{stroke-opacity:1}
  50%{stroke-opacity:0}}

@keyframes bordeCamina{
  to{stroke-dashoffset:calc(-16 * var(--m, 1) * 1px)}}


#m.frenado .pausa{animation-play-state:paused}


#m.acercado .pausa.fuera{animation-play-state:paused}







#ventana{position:fixed;inset:0;z-index:9;display:grid;place-items:center;
         align-items:safe center;
         padding:16px;background:#0a484233;opacity:0;
         transition:opacity .22s ease;pointer-events:none}
#ventana.abierta{opacity:1;pointer-events:auto}
#ventana[hidden]{display:none}
#cajaVentana{width:100%;max-width:420px;max-height:min(78vh,560px);overflow-y:auto;
             background:var(--papel);border:1px solid var(--borde);
             border-radius:20px;padding:20px;
             box-shadow:0 24px 60px #0a484240;scrollbar-width:none;
             transform:translateY(14px) scale(.985);
             transition:transform .26s cubic-bezier(.22,1,.36,1)}
#cajaVentana::-webkit-scrollbar{display:none}
#ventana.abierta #cajaVentana{transform:none}
#cierraVentana{float:right;width:34px;height:34px;margin:-6px -6px 0 10px;
               border:1px solid var(--borde);border-radius:99px;background:#fff;
               display:grid;place-content:center;cursor:pointer;
               transition:background .2s ease,border-color .2s ease}
#cierraVentana:hover{background:var(--lima);border-color:#8fbf9a}
#cierraVentana svg{width:15px;height:15px;display:block}


#vista{position:fixed;inset:0;z-index:10;display:grid;place-items:center;

       grid-template-columns:minmax(0,1fr);
       grid-template-rows:minmax(0,1fr);
       padding:18px;background:#0a4842b8;opacity:0;
       transition:opacity .2s ease;pointer-events:none}
#vista.on{opacity:1;pointer-events:auto}
#vista[hidden]{display:none}
#vista img{max-width:100%;max-height:100%;border-radius:14px;
           background:#fff;box-shadow:0 24px 60px #0a484266}
#accionesVista{position:absolute;top:14px;right:14px;display:flex;gap:10px}

#accionesVista a,#accionesVista button{
  width:42px;height:42px;border:0;border-radius:99px;background:#fff;
  color:var(--tinta);display:grid;place-content:center;cursor:pointer;
  box-shadow:0 6px 20px #0a484240;text-decoration:none;
  transition:background .2s ease}
#accionesVista a:hover,#accionesVista button:hover{background:var(--lima)}
#accionesVista svg{width:17px;height:17px;display:block}
#selloVentana{display:flex;align-items:center;gap:14px;margin-bottom:14px}

#selloVentana svg{width:52px;height:52px;flex:none;border-radius:14px;
                  background:var(--crema)}
#selloVentana svg *{fill:none;stroke:var(--tinta);stroke-width:1.9;
                    stroke-linecap:round;stroke-linejoin:round}
#selloVentana svg .relleno{fill:var(--tinta);stroke:none}

#selloVentana.sinAro svg{background:none}
#tVentana{font-size:19px;font-weight:780;letter-spacing:-.015em;line-height:1.25;
          color:var(--tinta)}
#xVentana{font-size:14px;line-height:1.6;color:var(--texto);white-space:pre-line;
          margin:0}

#botonVentana{margin-top:16px}
#botonVentana:empty{display:none}
#botonVentana .enlace{width:100%;justify-content:center}
#pieVentana{margin-top:18px;padding-top:14px;border-top:1px solid var(--borde);
            font-size:11px;font-weight:650;letter-spacing:.1em;
            text-transform:uppercase;color:var(--tenue)}

@media (min-width:760px) and (orientation:landscape){
  #cajaVentana{transform:translateY(10px) scale(.97)}
}






#ficha{position:fixed;z-index:2;display:flex;flex-direction:column;gap:12px;
       padding:14px 16px;border:1px solid var(--borde);border-radius:18px;
       background:#f3f9eef7;
       box-shadow:0 16px 40px #0a484226;pointer-events:none;
       left:14px;right:14px;bottom:14px;
       transition:box-shadow .35s ease,border-color .35s ease}
#ficha.on{border-color:#179e68aa;box-shadow:0 16px 40px #0a484226,0 0 0 1px #179e6833}
#rotulo{display:flex;align-items:center;gap:14px}
#punto{flex:none;width:50px;height:50px;border-radius:13px;display:grid;
       place-content:center;background:var(--lima);color:#0d3b34;
       transition:background .35s ease,color .35s ease,box-shadow .35s ease}
#ficha.on #punto{background:var(--tinta);color:#fff;box-shadow:0 0 22px #179e6866}
#lupa{width:24px;height:24px;display:block}
#titulo{display:block;font-size:17px;font-weight:750;letter-spacing:-.01em;
        line-height:1.25;color:var(--tinta)}
#pista{display:block;font-size:12.5px;color:var(--tenue);margin-top:3px}

#chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
       -webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border:1px solid var(--borde);border-radius:99px;
      background:#fff;color:#2c4f47;font:650 12.5px/1 system-ui,sans-serif;
      cursor:pointer;white-space:nowrap;pointer-events:auto;
      transition:border-color .25s ease,background .25s ease,color .25s ease}
.chip:hover{border-color:#8fbf9a}
.chip.act{border-color:var(--tinta);background:var(--tinta);color:#fff}


#enlaces{display:flex;flex-wrap:wrap;gap:8px;padding-top:13px;
         border-top:1px solid var(--borde)}

#enlaces:empty{display:none}
.enlace{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;
        border-radius:99px;background:var(--verde);color:#fff;
        text-decoration:none;font:700 12.5px/1 system-ui,sans-serif;
        white-space:nowrap;pointer-events:auto;
        transition:background .25s ease,box-shadow .25s ease}
.enlace:hover{background:#005c33;box-shadow:0 6px 18px #00723f4d}
.enlace:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.enlace svg{width:14px;height:14px;flex:none;opacity:.85}


@media (min-width:760px) and (orientation:landscape){
  #ficha{left:22px;right:auto;top:14px;bottom:14px;width:330px;
         transform:none;overflow-y:auto;pointer-events:auto;
         padding:20px;border-radius:20px;scrollbar-width:none}
  #ficha::-webkit-scrollbar{display:none}
  #chips{flex-wrap:wrap;overflow:visible}
  #enlaces{margin-top:auto}
  #enlaces .enlace{flex:1;justify-content:center}
}

var ES_VECTOR = {};

function sueltaIconosVector() {

    if (typeof svg !== "string" || !/^\s*<svg[\s>]/.test(svg)) return;
    var caja = /\bviewBox="([^"]*)"/.exec(svg);
    var abre = svg.indexOf(">"), cierra = svg.lastIndexOf("</svg>");
    if (!caja || abre < 0 || cierra < abre) return;
    ES_VECTOR[nombre] = true;
    trozos.push('<symbol id="ico-' + nombre + '" viewBox="' + caja[1] + '">'
              + svg.slice(abre + 1, cierra) + "</symbol>");
  });
  if (trozos.length) {
    s.querySelector("defs").insertAdjacentHTML("beforeend", trozos.join(""));

function figuraDe(tipo, conAro) {
  if (SIMBOLOS[tipo]) return '<g class="lam">' + SIMBOLOS[tipo] + "</g>";
  if (!PROPIOS[tipo]) return "";

  return '<image class="fig" href="' + PROPIOS[tipo] + '" x="-12.2" y="-12.2"'
       + ' width="24.4" height="24.4"' + recorte + "/>";
}


function nombreDe(tipo) {

function transformacionesDe(ic) {
  var trozos = [];
  var sx = ic.sx === undefined ? 1 : ic.sx;
  var sy = ic.sy === undefined ? 1 : ic.sy;
  if (sx !== 1 || sy !== 1) trozos.push("scale(" + sx + "," + sy + ")");
  if (ic.sk) trozos.push("skewX(" + ic.sk + ")");
  return trozos.length ? " " + trozos.join(" ") : "";
}

ICN.innerHTML = ICONOS.map(function (ic, k) {

  var conAro = conAroDe(ic);

  var Variables = (ic.m && ic.m !== 1) ? "--m:" + ic.m : "";
  if (ic.op !== undefined && ic.op !== 1) Variables += ";opacity:" + ic.op;
  var fuerza = Variables ? ' style="' + Variables + '"' : "";


  return "<g" + caja + fuerza + ' transform="translate(' + ic.x + "," + ic.y
       + ") scale(" + ((ic.s || TAM_ICONO) / 24) + ")"

function caja(puntos) {
  var xs = [], ys = [], p;
  for (var j = 0; j < puntos.length; j++) {
    p = puntos[j];
    xs.push(p[0]);
    ys.push(p[1]);
  }
  var x = Math.min.apply(null, xs), y = Math.min.apply(null, ys);
  return [x, y, Math.max.apply(null, xs) - x, Math.max.apply(null, ys) - y];
}


function encuadra(x, y, w, h, aire) {
  var c = s.getScreenCTM(), ux = c.a, uy = c.d,
      W = s.clientWidth, H = s.clientHeight,
      rf = F.getBoundingClientRect(),
      lateral = rf.width < W * .62,
      arriba = ARRIBA_LIBRE,
      izq = lateral ? rf.right + 12 : 0,
      abajo = lateral ? 0 : H - rf.top,
      ancho = W - izq, alto = H - arriba - abajo,
      k = Math.min(ancho / (ux * w * aire), alto / (uy * h * aire)),
      cx = izq + ancho / 2, cy = arriba + alto / 2;



  var puesto = M.style.transform;
  var nuevo = "translate(" + ((cx - c.e) / ux - k * (x + w / 2)) + "px,"
            + ((cy - c.f) / uy - k * (y + h / 2)) + "px) scale(" + k + ")";
  if (nuevo === puesto) return;
  frenaUnRato(800);
  M.style.transform = nuevo;
}

function elQueSePausa(nodo) {
  return nodo.classList.contains("pausa") ? nodo : nodo.querySelector(".pausa");
}

if (window.IntersectionObserver) {


  var pausables = [], observerRoto = false;
  var vigia = new IntersectionObserver(function (entradas) {
    if (observerRoto) return;
    for (var j = 0; j < entradas.length; j++) {
      var pausable = elQueSePausa(entradas[j].target);
      if (pausable) pausable.classList.toggle("fuera", !entradas[j].isIntersecting);
    }











    if (pausables.length >= 8) {
      var fuera = 0;
      for (var f = 0; f < pausables.length; f++)
        if (pausables[f].classList.contains("fuera")) fuera++;
      if (fuera > pausables.length * .9) {
        observerRoto = true;
        vigia.disconnect();
        for (var g = 0; g < pausables.length; g++) pausables[g].classList.remove("fuera");
      }
    }
  }, {rootMargin: "160px"});
  var vigilar = function (grupo) {
    for (var j = 0; j < grupo.children.length; j++) {
      var pausable = elQueSePausa(grupo.children[j]);
      if (pausable) {
        vigia.observe(grupo.children[j]);
        pausables.push(pausable);
      }
    }
  };







  requestAnimationFrame(function () {
    vigilar(ICN);
    vigilar(ZON);
  });
}


var VENT = document.getElementById("ventana"),

function enlaceSeguro(u) {

           + 'v-12A1.5 1.5 0 0 1 4.5 6h5"/></svg>';


var DESCARGA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
             + ' stroke-width="2.4" stroke-linecap="round"'
             + ' stroke-linejoin="round" aria-hidden="true">'
             + '<path d="M12 3.5v11"/><path d="M7.5 10 12 14.5 16.5 10"/>'

var CARPETA_RECURSOS = "RecursosExtra/";
var BASE_RECURSOS = "../" + CARPETA_RECURSOS;


var IMAGENES = ["png", "jpg", "jpeg", "webp", "gif", "avif", "svg", "bmp"];

function esRecurso(u) {
  return typeof u === "string" && u.indexOf(CARPETA_RECURSOS) === 0;
}

function direccionDe(u) {
  return esRecurso(u) ? BASE_RECURSOS + u.slice(CARPETA_RECURSOS.length) : u;
}

function nombreDeRecurso(u) {
  return String(u).split("/").pop();
}

function esImagen(u) {
  var limpio = String(u).split("?")[0].split("#")[0].toLowerCase();
  var punto = limpio.lastIndexOf(".");
  return punto > 0 && IMAGENES.indexOf(limpio.slice(punto + 1)) >= 0;
}


function montaEnlace(a, texto, destino) {
  a.textContent = "";


  if (!texto || !enlaceSeguro(destino)) {
    a.hidden = true;
    a.removeAttribute("href");
    return;
  }
  var dentro = esRecurso(destino), archivo = dentro && !esImagen(destino);
  a.hidden = false;
  a.href = direccionDe(destino);
  a.dataset.destino = destino;



  if (archivo) {
    a.setAttribute("download", "");
    a.removeAttribute("target");
    a.removeAttribute("rel");
  } else if (dentro) {
    a.removeAttribute("download");
    a.removeAttribute("target");
    a.removeAttribute("rel");
  } else {
    a.removeAttribute("download");
    a.setAttribute("target", "_blank");

    a.setAttribute("rel", "noopener noreferrer");
  }
  a.innerHTML = archivo ? DESCARGA : FLECHA;
  a.appendChild(document.createTextNode(texto));
}


function alPulsarEnlace(e) {
  var destino = e.currentTarget.dataset.destino;
  if (esRecurso(destino) && esImagen(destino)) {

var SELLO_LADO = 52, SELLO_LIBRES = 5;


function encajaSello(svg) {
  if (!svg || !svg.getBBox) return;
  var caja = cajaDeLaFigura(svg);
  if (!caja || !(caja.width > 0) || !(caja.height > 0)) return;
  var ancho = svg.getBoundingClientRect().width || SELLO_LADO;

  var lado = Math.max(caja.width, caja.height) * ancho / (ancho - 2 * SELLO_LIBRES);
  var cx = caja.x + caja.width / 2, cy = caja.y + caja.height / 2;
  svg.setAttribute("viewBox", (cx - lado / 2) + " " + (cy - lado / 2)
                              + " " + lado + " " + lado);
}


function cajaDeLaFigura(svg) {
  var dibujo = svg && svg.firstElementChild;
  if (!dibujo) return null;

  if (dibujo.tagName === "use") {
    var ref = (dibujo.getAttribute("href")
            || dibujo.getAttribute("xlink:href") || "").slice(1);
    var simbolo = ref && document.getElementById(ref);
    if (!simbolo) return null;
    var vb = simbolo.viewBox && simbolo.viewBox.baseVal;
    var rx = numeroDe(dibujo, "x"), ry = numeroDe(dibujo, "y");

    if (!vb || !(vb.width > 0) || !(vb.height > 0))
      return {x: rx, y: ry,
              width: numeroDe(dibujo, "width"),
              height: numeroDe(dibujo, "height")};
    var rw = numeroDe(dibujo, "width") || vb.width;
    var rh = numeroDe(dibujo, "height") || vb.height;

    var k = Math.min(rw / vb.width, rh / vb.height);
    var dw = vb.width * k, dh = vb.height * k;
    return {x: rx + (rw - dw) / 2 + vb.x * k,
            y: ry + (rh - dh) / 2 + vb.y * k,
            width: dw, height: dh};
  }


  if (!dibujo.getBBox) return null;
  try {
    return dibujo.getBBox();
  } catch (e) {
    return null;
  }
}

function numeroDe(nodo, que) {
  var v = parseFloat(nodo.getAttribute(que));
  return isNaN(v) ? 0 : v;
}

function abreVentana(k) {
  var ic = ICONOS[k];
  if (!ic || !ic.i) return;
  TVENT.textContent = ic.i[0];
  XVENT.textContent = ic.i[1];

  SELLO.innerHTML = '<svg viewBox="-13 -13 26 26">' + figuraDe(ic.t, false)

  encajaSello(SELLO.firstElementChild);

  CVENT.focus({preventScroll: true});
}

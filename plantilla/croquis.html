<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mapa · Día del Orgullo Cimarrón 2026</title>
<style>
/* El arte es el mapa que se hizo en Illustrator. Este archivo solo lo hace
   interactivo, asi que la paleta sale del propio mapa: el crema del papel
   #f3f9ee, el verde del pasto #179e68, el verde claro #80c458 y el verde
   profundo de los contornos #0a4842.

   El fondo de la pagina va un punto mas verde que el papel del mapa
   (#dfeada frente a #f3f9ee) a proposito: asi se ve donde acaba la hoja y
   los margenes del mapa no se confunden con la pantalla. La reticula de
   puntos remata los margenes en las pantallas anchas. */
:root{
  --papel:#f3f9ee; --fondo:#dfeada; --tinta:#0a4842; --pasto:#179e68;
  --lima:#80c458; --crema:#d6edce; --texto:#0d3b34; --tenue:#4d6d64; --borde:#b8d4bb;
  --verde:#00723f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background-color:var(--fondo);
  background-image:
    radial-gradient(58% 46% at 8% 0%,#179e6820,transparent 65%),
    radial-gradient(52% 44% at 94% 100%,#80c45826,transparent 65%),
    radial-gradient(#c2d9c4 1.3px,transparent 1.4px);
  background-size:auto,auto,26px 26px;
  background-attachment:fixed;
  color:var(--texto);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  touch-action:none;-webkit-tap-highlight-color:transparent;
}
#s{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
/* `will-change` avisa al navegador de que este <g> se va a transformar, para
   que lo prepare en su propia capa y la animacion no tenga que repintar el
   mapa entero en cada fotograma. Sin esto, en un movil el zoom va a tirones.

   Pero va SOLO MIENTRAS el mapa se mueve, en la clase `.acercando`, y eso es
   tan importante como el propio `will-change`:

   Una capa se dibuja UNA vez, en una textura, y a partir de ahi se escala esa
   textura como si fuera una foto. Con `will-change` puesto para siempre, al
   acercar el mapa tres veces lo que se ve es la textura ampliada, y TODO sale
   pixelado: los iconos, que son vectores, y las lineas de las zonas. En un
   ordenador el navegador rehace la capa al acabar el movimiento y no se nota;
   en un movil se queda la textura escalada, que es justo el sintoma de «los
   iconos se ven pixelados al hacer zoom». Se suelta al terminar y el
   navegador vuelve a dibujar el mapa a la resolucion nueva. */
#m{transform-box:view-box;transform-origin:0 0;
   transition:transform .65s cubic-bezier(.22,1,.36,1)}
#m.acercando{will-change:transform}
/* El mapa es una hoja: un filo tenue y una sombra lo despegan del fondo. */
#hoja{filter:drop-shadow(0 10px 26px #0a484233)}
/* La version grande del fondo entra por encima de la chica, y solo cuando ya
   esta cargada: asi el cambio no se ve. Cambiarle el `href` a una sola imagen
   dejaria el mapa en blanco mientras llega, que es peor que verlo algo
   borroso un instante. */
#arteGrande{opacity:0;transition:opacity .35s ease}

/* Los iconos son los simbolos de punto: banos, primeros auxilios, comida...
   Van encima del mapa y por defecto NO reciben el toque, que sigue siendo de
   las zonas; si no, un icono plantado en medio de un estacionamiento se
   comeria la pulsacion de esa parte del estacionamiento.

   La excepcion son los que llevan informacion: esos si se tocan, porque al
   pulsarlos sale una ventana. Son pocos y pequenos, asi que lo que le quitan
   a la zona de debajo es un trozo minusculo a cambio de algo que se puede
   consultar.

   El aro claro los despega del pasto, que es una textura cargada y se come
   los trazos finos. El grosor va con vector-effect para que no engorde al
   ampliar: un icono ampliado 4x con el trazo escalado se ve como un garabato. */
#iconos{pointer-events:none}
#iconos .aro{fill:#fffffff2;stroke:#0a4842;stroke-opacity:.32;stroke-width:1.2;
             vector-effect:non-scaling-stroke}
#iconos .lam *{fill:none;stroke:var(--tinta);stroke-width:1.9;
               stroke-linecap:round;stroke-linejoin:round;
               vector-effect:non-scaling-stroke}
#iconos .lam .relleno{fill:var(--tinta);stroke:none}

/* Las imagenes propias ya vienen recortadas en circulo por el clipPath, asi
   que aqui no hay nada que hacer salvo que no se salgan del aro. */
#iconos .fig{pointer-events:none}

/* --- Sin circulo -----------------------------------------------------------
   Un icono puede ir sin el aro, solo con su dibujo. Es lo que conviene para
   una imagen que ya es redonda de por si, o para un simbolo que se lee mejor
   suelto.

   Quitarle el aro tiene un precio: las lineas finas se pierden sobre el pasto,
   que es una textura cargada. Se compensa con un halo blanco alrededor del
   trazo, hecho con drop-shadow en las cuatro direcciones. El halo es de la
   misma medida en unidades del mapa, asi que crece con el icono y no se
   convierte en una mancha al ampliar. */
#iconos .sinAro .lam{filter:drop-shadow(0 0 1.6px #fff) drop-shadow(0 0 1.6px #fff)}
/* Una imagen sin aro tampoco lleva el recorte en circulo: si se quita el
   circulo, se quita entero, y una foto sale como es. */
#iconos .sinAro .fig{clip-path:none}

/* Un icono con informacion se puede pulsar, y lo dice: se le marca el filo y
   sale la manita. Sin esa pista no hay forma de saber cuales llevan algo
   detras.

   El pointer-events hay que devolverselo uno por uno: el grupo de arriba lo
   tiene en `none` y eso lo heredan los hijos, asi que sin esta linea el icono
   seguiria sin recibir el toque por mucho cursor:pointer que tenga. */
/* El filo verde de los iconos con informacion solo sale con el mapa acercado:
   es cuando de verdad se pueden pulsar. Un filo que promete un toque que no
   hace nada es peor que no tenerlo. */
#iconos .conInfo{cursor:pointer}
#iconos.deCerca .conInfo{pointer-events:auto}
#iconos.deCerca .conInfo .aro{stroke:var(--verde);stroke-opacity:.55}
#iconos.deCerca .conInfo:hover .aro,
#iconos.deCerca .conInfo:focus-visible .aro{
  stroke:var(--verde);stroke-opacity:1;stroke-width:2;fill:#fff}

/* --- La superficie que recibe el toque -------------------------------------
   Devolverle el pointer-events al grupo del icono NO basta: el grupo no tiene
   forma propia, asi que el toque lo tiene que recoger algo de dentro. Cuando
   el icono lleva aro lo recoge el aro, que esta pintado.

   Sin aro no quedaba nada: la imagen tiene el toque desactivado a proposito
   (para no quitarle la pulsacion a la zona de debajo) y el dibujo de un
   simbolo son trazos sueltos. El toque se colaba hasta el mapa, asi que
   pulsar un icono con informacion no abria la ventana: deshacia el zoom.

   Este circulo se dibuja siempre en los iconos con informacion y es la
   superficie de verdad. Va con `fill:none` para que no se vea y con
   `pointer-events:fill`, que da por bueno el relleno aunque no se pinte:
   con `pointer-events:auto` no valdria, porque ese valor exige que la forma
   este pintada, y con `fill:none` no lo esta. */
#iconos .toque{fill:none;pointer-events:fill}

/* --- Las animaciones -------------------------------------------------------
   Se aplican a un <g> INTERIOR, nunca al que lleva la posicion. En SVG el
   `transform` de CSS pisa al atributo `transform`, asi que animar el <g> de
   fuera borraria el translate que pone el icono en su sitio y todos se
   apilarian en la esquina.

   Se mueven transform y opacidad, que el navegador compone sin repintar, y
   son suaves a proposito: esto es un mapa, no un anuncio. `transform-box` y
   `transform-origin` hacen que giren y latan sobre su propio centro (el 0,0
   donde estan dibujados) y no sobre la esquina de la hoja.

   La INTENSIDAD va en la variable `--m`, que cada icono lleva puesta en su
   <g> de fuera (por defecto 1). Los keyframes la usan dentro de un calc(), asi
   que la misma animacion sirve para todos y cada uno se mueve lo suyo sin
   duplicar reglas. La variable se hereda, asi que ponerla en el <g> de fuera
   basta; y ahi es seguro porque un `style` con solo una variable no toca el
   atributo `transform` que lleva ese mismo elemento. */
#iconos .an{transform-box:fill-box;transform-origin:center}
#iconos .an.late{animation:icLate 2.4s ease-in-out infinite}
#iconos .an.flota{animation:icFlota 3.2s ease-in-out infinite}
#iconos .an.gira{animation:icGira 14s linear infinite}
#iconos .an.brilla{animation:icBrilla 2.6s ease-in-out infinite}
#iconos .an.ondas{animation:icOndas 2.6s ease-out infinite}
/* Vibra y viento van mas rapido que las otras a proposito: son las dos que
   imitan algo que se mueve solo, y a camara lenta no se reconocen. */
#iconos .an.vibra{animation:icVibra .22s linear infinite}
/* El viento pivota en su BASE, no en el centro como las demas. Un arbol no se
   mueve entero: la raiz se queda quieta y la copa se dobla. Con el pivote en
   el centro el icono se balancea sobre su propio eje y eso se lee como algo
   que flota, no como algo que aguanta el aire desde abajo. */
#iconos .an.viento{animation:icViento 3.4s ease-in-out infinite;
                   transform-origin:50% 100%}

/* --- Cuando no hace falta animar -------------------------------------------
   Estas dos reglas son la optimizacion mas importante del croquis en un movil
   de gama baja, y no cambian nada de lo que se ve.

   El motivo, medido en el navegador: en cuanto hay UNA animacion corriendo, el
   compositor produce un fotograma a la frecuencia de la pantalla y no para
   nunca. Cuesta lo mismo con un icono animado que con cuarenta (1.69 ms por
   fotograma con uno, 2.32 ms con cuarenta): el gasto es del fotograma, no de
   los iconos. Con cero animaciones el compositor no produce ni un fotograma y
   el gasto es cero.

   En un ordenador eso no se nota. En un telefono de gama baja son entre 15 y
   30 ms por fotograma de forma continua, y ahi es donde se traba: no por un
   icono de mas, sino por no parar nunca.

   Asi que se para en los dos casos en que nadie las esta mirando:

     .frenado  todo el mapa, mientras se mueve o la pagina no se ve
     .fuera    un elemento concreto que ha quedado fuera de la pantalla

   Lo segundo se nota sobre todo ampliado: en un movil, mirando una zona de
   cerca, de los 48 iconos se ven cuatro o cinco. Los otros cuarenta estaban
   gastando lo mismo sin que nadie los viera.

   La regla que de verdad los para esta mas abajo, despues de las animaciones
   de las zonas, y no aqui: se explica alli por que el sitio importa. */


/* Un latido: crece y vuelve. */
@keyframes icLate{
  0%,100%{transform:scale(1)}
  50%{transform:scale(calc(1 + .1 * var(--m, 1)))}}
/* Sube y baja despacio. */
@keyframes icFlota{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(calc(-1.6px * var(--m, 1)))}}
/* Una vuelta completa. No tiene intensidad: no hay nada que ampliar, asi que
   el editor no ofrece el control para esta. */
@keyframes icGira{to{transform:rotate(360deg)}}
/* Aparece y desaparece. La opacidad la recorta el navegador al rango 0..1 por
   su cuenta, asi que con intensidad alta se queda en 0 un momento y ya esta. */
@keyframes icBrilla{
  0%,100%{opacity:1}
  50%{opacity:calc(1 - .58 * var(--m, 1))}}
/* Un anillo que se expande desde el icono y se desvanece, como un radar. La
   intensidad decide hasta donde llega: con poca, el anillo apenas asoma. */
@keyframes icOndas{
  0%{transform:scale(1);opacity:.55}
  70%{transform:scale(calc(1 + .9 * var(--m, 1)));opacity:0}
  100%{transform:scale(calc(1 + .9 * var(--m, 1)));opacity:0}}
/* Temblor: va y viene muy rapido y en diagonal, con un giro minimo. Cada paso
   empuja hacia un lado distinto para que no se lea como un balanceo. */
@keyframes icVibra{
  0%,100%{transform:translate(0,0) rotate(0)}
  12%{transform:translate(calc(-.5px * var(--m, 1)),calc(.15px * var(--m, 1)))
     rotate(calc(-1deg * var(--m, 1)))}
  25%{transform:translate(calc(.45px * var(--m, 1)),calc(-.2px * var(--m, 1)))
     rotate(calc(.9deg * var(--m, 1)))}
  37%{transform:translate(calc(-.35px * var(--m, 1)),calc(-.15px * var(--m, 1)))
     rotate(calc(-.7deg * var(--m, 1)))}
  50%{transform:translate(calc(.5px * var(--m, 1)),calc(.2px * var(--m, 1)))
     rotate(calc(1.1deg * var(--m, 1)))}
  62%{transform:translate(calc(-.4px * var(--m, 1)),calc(.1px * var(--m, 1)))
     rotate(calc(-.9deg * var(--m, 1)))}
  75%{transform:translate(calc(.3px * var(--m, 1)),calc(-.1px * var(--m, 1)))
     rotate(calc(.6deg * var(--m, 1)))}
  87%{transform:translate(calc(-.45px * var(--m, 1)),calc(.15px * var(--m, 1)))
     rotate(calc(-1.1deg * var(--m, 1)))}}
/* Viento: se dobla hacia un lado y vuelve, con una racha mas fuerte despues.
   Los tiempos no son simetricos a proposito; una racha pareja se lee como un
   mecanismo y no como aire.

   Son dos movimientos a la vez: el `rotate` inclina el icono entero sobre su
   base, y el `skewX` lo dobla por arriba, que es lo que hace un arbol. Con
   solo el giro queda un palo rigido; con solo el sesgo la base tambien se
   mueve. Juntos, la base se queda clavada y la copa va y viene.

   Con el `skewX`, cada punto se desplaza en X segun lo lejos que este del
   origen, y el origen es la base: por eso lo de abajo no se mueve y lo de
   arriba si.

   **El sesgo va con el signo contrario al del nombre y eso no es un error.**
   Los dos empujan a la copa, pero en sentidos opuestos: el `rotate` positivo
   la manda a la derecha y un `skewX` positivo la manda a la izquierda, con lo
   que se cancelan y el icono se queda casi quieto (medido: 0.8 de los 3.9
   que deberia moverse). Con el `skewX` en negativo los dos suman y el doblez
   se ve.

   Los grados son mas altos que los de las otras animaciones porque el pivote
   esta abajo: el mismo angulo mueve mucho menos la punta que si girara sobre
   el centro. Con los 5 grados que tenia antes, la copa se movia menos de un
   pixel y no se veia nada. */
@keyframes icViento{
  0%,100%{transform:rotate(0) skewX(0)}
  20%{transform:rotate(calc(3.2deg * var(--m, 1)))
     skewX(calc(-2.2deg * var(--m, 1)))}
  40%{transform:rotate(calc(1.2deg * var(--m, 1)))
     skewX(calc(-0.8deg * var(--m, 1)))}
  62%{transform:rotate(calc(5.5deg * var(--m, 1)))
     skewX(calc(-3.6deg * var(--m, 1)))}
  84%{transform:rotate(calc(2deg * var(--m, 1)))
     skewX(calc(-1.3deg * var(--m, 1)))}}

/* El anillo que se expande en las ondas. Va con el trazo del color de la
   tinta y sin relleno, para que se lea como una onda y no como un aro solido. */
#iconos .onda{fill:none;stroke:var(--verde);stroke-width:1.6;stroke-opacity:.9;
              vector-effect:non-scaling-stroke}

/* --- Un ajuste del sistema que se quito a proposito -------------------------
   Aqui vivia una regla que apagaba todas las animaciones cuando el sistema
   pedia menos movimiento:

       @media (prefers-reduced-motion:reduce){
         #iconos .an,#zonas .g{animation:none !important}
       }

   Ya no esta, y no es un olvido.

   El motivo es que las animaciones de este mapa NO son adorno de fondo: las
   elige una por una quien edita, en el editor, y son parte de lo que el mapa
   cuenta. Un ajuste del sistema no debe borrar lo que el autor ha decidido
   poner. Ademas la regla tenia una historia enganosa: durante toda la vida del
   proyecto NO hacia nada, porque las reglas que dan animacion a cada clase
   tienen mas fuerza que una que solo nombre el grupo. Al ponerle `!important`
   para que por fin funcionara, se apago el mapa entero de golpe: en un equipo
   con el ajuste puesto, ni los iconos ni las lineas se movian, y el sintoma
   parecia «la animacion no funciona» en vez de «el sistema la esta tapando».

   Si algun dia se quiere recuperar, esta es la linea, y hay que probarla en un
   equipo CON el ajuste puesto:

       @media (prefers-reduced-motion:reduce){
         #iconos .an,#zonas .g{animation:none !important}
       }
*/

/* --- Los adornos de las zonas ----------------------------------------------
   Una zona nace invisible: es un poligono transparente que solo existe para
   recibir el toque. Los adornos son opcionales y no cambian eso: sin relleno y
   sin linea, la zona se comporta igual que antes de que existieran.

   El toque y lo que se ve van en el MISMO poligono. No hace falta uno aparte
   encima: con el relleno transparente el navegador ya lo da por pintado y
   recibe la pulsacion, que es como funcionaba antes. Poner un segundo poligono
   solo para pintar seria duplicar los puntos y tener dos cosas que se pueden
   desincronizar.

   El `vector-effect` mantiene la linea del mismo grosor al ampliar. Vale
   tambien para los guiones: al no escalar, la raya de la carretera mide lo
   mismo de cerca que de lejos, en vez de engordar con el zoom. */
#zonas .g{stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
/* El punteado de la linea quieta: corto y apretado, para que se lea como un
   filo punteado y no como una carretera. */
#zonas .g.punteada{stroke-dasharray:3 4}

/* --- Las animaciones de las zonas ------------------------------------------
   Dos familias, porque son dos cosas distintas y se pueden combinar:

     .za-*  la zona entera, relleno y linea
     .zb-*  solo el borde, o sea la linea

   Se mueven `opacity` (la zona) y `stroke-opacity` / `stroke-dashoffset` (el
   borde). Son propiedades distintas, asi que se pueden animar a la vez sin
   pisarse: una zona puede latir mientras su borde avanza.

   Pero para que de verdad convivan hay que declararlas como VARIABLES y
   juntarlas en una sola regla. `animation` es una propiedad de taquigrafia, y
   eso quiere decir que la ultima regla que la toca BORRA la anterior: con una
   declaracion por clase, una zona con las dos animaciones solo se quedaba con
   la del borde -que va despues- y la de la zona desaparecia sin dar ningun
   error. Con las variables, cada familia pone la suya y la regla comun las
   suma.

   La intensidad va en la misma variable `--m` que los iconos, puesta en el
   propio poligono. Por defecto 1, que es el movimiento de fabrica. */
#zonas .g{animation:var(--az, none), var(--ab, none)}
#zonas .g.za-late{--az:zonaLate 3s ease-in-out infinite}
#zonas .g.za-brilla{--az:zonaBrilla 2.8s ease-in-out infinite}
#zonas .g.za-destello{--az:zonaDestello 4s ease-out infinite}
/* `camina` se pone DESPUES de `.punteada` a proposito: las dos reglas tienen
   la misma fuerza, asi que gana la ultima. Una linea que avanza necesita
   guiones mas largos que un punteado quieto, y si el punteado ganara, la
   carretera saldria con rayitas de hormiga. */
#zonas .g.zb-camina{
  stroke-dasharray:calc(9 * var(--m, 1) * 1px) calc(7 * var(--m, 1) * 1px);
  --ab:bordeCamina 1.6s linear infinite}
/* Y la misma carretera al reves. Se le da la vuelta con `reverse` en vez de
   escribir un segundo keyframe: el viaje es el mismo y lo unico que cambia es
   el sentido, asi que `reverse` dice exactamente eso y no deja dos numeros que
   se puedan separar. Recorrido al reves, de -16 a 0, que es el mismo periodo:
   el bucle sigue siendo continuo. */
#zonas .g.zb-camina.zd-reves{--ab:bordeCamina 1.6s linear infinite reverse}
#zonas .g.zb-late{--ab:bordeLate 3s ease-in-out infinite}
#zonas .g.zb-brilla{--ab:bordeBrilla 2.8s ease-in-out infinite}

/* La zona late: se aclara y vuelve, sin llegar a desaparecer nunca. */
@keyframes zonaLate{
  0%,100%{opacity:1}
  50%{opacity:calc(1 - .45 * var(--m, 1))}}
/* Aparece y desaparece del todo. */
@keyframes zonaBrilla{
  0%,100%{opacity:1}
  50%{opacity:0}}
/* Un aviso: sube y baja rapido, y se queda quieta el resto del ciclo. */
@keyframes zonaDestello{
  0%,12%,100%{opacity:1}
  5%{opacity:calc(1 - .75 * var(--m, 1))}}
@keyframes bordeLate{
  0%,100%{stroke-opacity:.95}
  50%{stroke-opacity:calc(.95 - .6 * var(--m, 1))}}
@keyframes bordeBrilla{
  0%,100%{stroke-opacity:1}
  50%{stroke-opacity:0}}
/* La carretera: los guiones van avanzando por todo el borde.

   El desplazamiento tiene que ser EXACTAMENTE un periodo de guiones para que el
   bucle no de un salto. El periodo es 9 + 7 = 16, y por eso el numero de aqui
   abajo tiene que ser 16 y no otro: con 15 o 17, cada vuelta daria un tiron
   visible. Y va en negativo porque el patron se mueve al reves que el
   desplazamiento: en positivo, la linea pareceria ir hacia atras.

   El `* 1px` del final NO es un adorno, y quitarlo rompe la animacion entera:
   sin el, el calculo da un numero sin unidad, y el navegador NO lo interpola.
   Medido: sin el `1px` el desplazamiento pasa por 2 valores y salta de 0 a -16
   de golpe, o sea que los guiones PARPADEAN en el sitio en vez de avanzar; con
   el, pasa por 34 valores y recorre el camino. Lo peor es que no da ningun
   error: la animacion figura como corriendo y el valor final es el correcto,
   asi que el sintoma se lee como «la animacion no se ve», que es justo lo que
   se reporto. */
@keyframes bordeCamina{
  to{stroke-dashoffset:calc(-16 * var(--m, 1) * 1px)}}

/* --- La regla que para las animaciones -------------------------------------
   Va AQUI, al final de todas las animaciones, y el sitio no es casual: las
   reglas que dan animacion a cada clase y esta tienen la misma fuerza, asi que
   decide el orden. Puesta antes, las de las zonas la pisaban y el mapa seguia
   animandose durante el zoom aunque los iconos ya estuvieran parados: un fallo
   que no da ningun error, solo un telefono que se sigue trabando.

   El freno va en #m, que es el padre comun de las zonas y de los iconos, asi
   que una sola clase los para todos. Y `.pausa` marca lo que de verdad anima,
   que no es lo mismo en los dos casos: en un icono es el grupo de dentro y en
   una zona es el propio poligono. El `#m` del segundo selector tambien hace
   falta: sin el, la regla seria mas debil que las de las animaciones y no
   pararia nada.

   `animation-play-state` en vez de quitar la animacion: al reanudar sigue por
   donde iba, asi que los elementos no dan un salto al volver a mirarlos. */
#m.frenado .pausa,
#m .pausa.fuera{animation-play-state:paused}

/* La del sistema (`prefers-reduced-motion`) se quito a proposito. Donde estaba
   y por que se explica arriba, en la seccion de las animaciones de los iconos. */

/* --- La ventana de informacion ---------------------------------------------
   Mismo lenguaje que el panel: mismo fondo, mismo filo, mismo radio y el
   verde institucional. Sale del centro hacia arriba y desaparece sin dejar
   rastro, para que se vea que es algo que se abre encima del mapa y no una
   pantalla aparte.

   Sale CENTRADA, tambien en el movil. Antes se pegaba abajo y ocupaba el
   ancho: la idea era no tener que acertarle al boton de cerrar, pero en un
   telefono alto la ventana quedaba a media pantalla de distancia del icono
   que se acababa de tocar, y parecia que no habia pasado nada.

   El `safe center` de la segunda linea es por si la caja no cupiera de alto:
   con un `center` a secas, lo que sobra se sale por ARRIBA y de ahi no se
   puede bajar con el dedo. `safe` lo pega al borde en ese caso. Si el
   navegador no lo entiende, se queda con el `center` de la linea anterior,
   que es lo normal: la caja nunca pasa del 78% del alto de la pantalla. */
#ventana{position:fixed;inset:0;z-index:9;display:grid;place-items:center;
         align-items:safe center;
         padding:16px;background:#0a484233;opacity:0;
         transition:opacity .22s ease;pointer-events:none}
#ventana.abierta{opacity:1;pointer-events:auto}
#ventana[hidden]{display:none}
#cajaVentana{width:100%;max-width:420px;max-height:min(78vh,560px);overflow-y:auto;
             background:var(--papel);border:1px solid var(--borde);
             border-radius:20px;padding:20px;
             box-shadow:0 24px 60px #0a484240;scrollbar-width:none;
             transform:translateY(14px) scale(.985);
             transition:transform .26s cubic-bezier(.22,1,.36,1)}
#cajaVentana::-webkit-scrollbar{display:none}
#ventana.abierta #cajaVentana{transform:none}
#cierraVentana{float:right;width:34px;height:34px;margin:-6px -6px 0 10px;
               border:1px solid var(--borde);border-radius:99px;background:#fff;
               display:grid;place-content:center;cursor:pointer;
               transition:background .2s ease,border-color .2s ease}
#cierraVentana:hover{background:var(--lima);border-color:#8fbf9a}
#cierraVentana svg{width:15px;height:15px;display:block}

/* La vista previa de un archivo de RecursosExtra. Va aparte de la ventana de
   informacion y no dentro, porque son dos cosas distintas: la ventana cuenta
   algo de un icono, y esto ensena un archivo entero. Ademas la ventana se
   cierra al tocar el mapa -esta pensada para leer dos lineas y seguir- y un
   plano que se esta mirando no deberia irse porque un dedo roce fuera. */
#vista{position:fixed;inset:0;z-index:10;display:grid;place-items:center;
       /* Las dos pistas con `minmax(0,1fr)`: sin eso la fila se mide por el
          contenido, y un `max-height:100%` dentro de una pista que se mide
          por el contenido se resuelve como `none`. En un movil no se notaba
          porque la pantalla es mas chica que la imagen; en un monitor, donde
          la foto de un plano es mas grande que la ventana, se salia por los
          cuatro lados. */
       grid-template-columns:minmax(0,1fr);
       grid-template-rows:minmax(0,1fr);
       padding:18px;background:#0a4842b8;opacity:0;
       transition:opacity .2s ease;pointer-events:none}
#vista.on{opacity:1;pointer-events:auto}
#vista[hidden]{display:none}
#vista img{max-width:100%;max-height:100%;border-radius:14px;
           background:#fff;box-shadow:0 24px 60px #0a484266}
#accionesVista{position:absolute;top:14px;right:14px;display:flex;gap:10px}
/* Los dos botones de arriba a la derecha: descargar y cerrar. Miden lo mismo y
   se ven igual, porque son hermanos y ninguno manda sobre el otro. */
#accionesVista a,#accionesVista button{
  width:42px;height:42px;border:0;border-radius:99px;background:#fff;
  color:var(--tinta);display:grid;place-content:center;cursor:pointer;
  box-shadow:0 6px 20px #0a484240;text-decoration:none;
  transition:background .2s ease}
#accionesVista a:hover,#accionesVista button:hover{background:var(--lima)}
#accionesVista svg{width:17px;height:17px;display:block}
#selloVentana{display:flex;align-items:center;gap:14px;margin-bottom:14px}
/* El sello mide siempre lo mismo, y el icono se coloca dentro con un margen
   calculado. El hueco NO lo da un `padding`: lo da el `viewBox`, que el script
   ajusta al dibujo de verdad. Con un padding fijo, un icono alargado se sale
   de la caja o se queda diminuto segun su forma.

   Aqui solo queda el fondo. */
#selloVentana svg{width:52px;height:52px;flex:none;border-radius:14px;
                  background:var(--crema)}
#selloVentana svg *{fill:none;stroke:var(--tinta);stroke-width:1.9;
                    stroke-linecap:round;stroke-linejoin:round}
#selloVentana svg .relleno{fill:var(--tinta);stroke:none}
/* Si el icono va sin circulo en el mapa, aqui va sin marco. El icono de la
   ventana es el mismo que se acaba de tocar, asi que tiene que verse igual:
   con el marco puesto, un icono suelto en el mapa aparecia metido en una caja
   al abrirlo, y parece que el toque abrio otro icono. */
#selloVentana.sinAro svg{background:none}
#tVentana{font-size:19px;font-weight:780;letter-spacing:-.015em;line-height:1.25;
          color:var(--tinta)}
#xVentana{font-size:14px;line-height:1.6;color:var(--texto);white-space:pre-line;
          margin:0}
/* El boton de enlace, si el icono lleva uno. Va pegado al texto y con el aire
   justo para que se lea como una salida y no como parte de la explicacion.

   El `:empty` lo esconde: el hueco no existe cuando no hay enlace, en vez de
   quedar un margen suelto al final de la ventana. */
#botonVentana{margin-top:16px}
#botonVentana:empty{display:none}
#botonVentana .enlace{width:100%;justify-content:center}
#pieVentana{margin-top:18px;padding-top:14px;border-top:1px solid var(--borde);
            font-size:11px;font-weight:650;letter-spacing:.1em;
            text-transform:uppercase;color:var(--tenue)}

@media (min-width:760px) and (orientation:landscape){
  #cajaVentana{transform:translateY(10px) scale(.97)}
}

/* Al tocar, solo se hace zoom. Las zonas no se resaltan ni se oscurece el
   resto del mapa: el diseno de Illustrator ya se lee solo y cualquier
   adorno encima lo ensucia. */

#cab{position:fixed;top:0;left:0;right:0;z-index:2;padding:16px 20px 30px;
     display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
     pointer-events:none;background:linear-gradient(#f3f9eeff,#f3f9ee00)}
#marca{font-size:16px;font-weight:800;letter-spacing:.02em;color:var(--tinta)}
#lugar{font-size:11px;font-weight:650;letter-spacing:.13em;text-transform:uppercase;
       color:var(--tenue)}

/* El panel lleva los accesos rapidos: en el movil acertarle a una banda
   diagonal es dificil, asi que ademas de informar sirve para navegar.

   Llevaba un backdrop-filter con desenfoque de 14 px que se quito: con el
   fondo al 97% de opacidad (#f3f9eef7) no se veia nada de lo de detras, y
   en cambio obligaba a recalcular el desenfoque en CADA fotograma del zoom,
   porque debajo hay un mapa que se esta moviendo. Pagaba un precio alto por
   un efecto invisible. */
#ficha{position:fixed;z-index:2;display:flex;flex-direction:column;gap:12px;
       padding:14px 16px;border:1px solid var(--borde);border-radius:18px;
       background:#f3f9eef7;
       box-shadow:0 16px 40px #0a484226;pointer-events:none;
       left:14px;right:14px;bottom:14px;
       transition:box-shadow .35s ease,border-color .35s ease}
#ficha.on{border-color:#179e68aa;box-shadow:0 16px 40px #0a484226,0 0 0 1px #179e6833}
#rotulo{display:flex;align-items:center;gap:14px}
#punto{flex:none;width:50px;height:50px;border-radius:13px;display:grid;
       place-content:center;background:var(--lima);color:#0d3b34;
       transition:background .35s ease,color .35s ease,box-shadow .35s ease}
#ficha.on #punto{background:var(--tinta);color:#fff;box-shadow:0 0 22px #179e6866}
#lupa{width:24px;height:24px;display:block}
#titulo{display:block;font-size:17px;font-weight:750;letter-spacing:-.01em;
        line-height:1.25;color:var(--tinta)}
#pista{display:block;font-size:12.5px;color:var(--tenue);margin-top:3px}

#chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
       -webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border:1px solid var(--borde);border-radius:99px;
      background:#fff;color:#2c4f47;font:650 12.5px/1 system-ui,sans-serif;
      cursor:pointer;white-space:nowrap;pointer-events:auto;
      transition:border-color .25s ease,background .25s ease,color .25s ease}
.chip:hover{border-color:#8fbf9a}
.chip.act{border-color:var(--tinta);background:var(--tinta);color:#fff}

/* Debajo de los accesos rapidos va el enlace de fuera: el programa del
   evento, que vive en el ownCloud de la UABC. Es otra cosa que los chips de
   arriba (aquellos llevan a una zona del mapa; este sale del mapa), asi que
   va separado con un filo y con un boton lleno del verde institucional, que
   no se confunde con el chip activo.

   Lleva el icono de salir a otro sitio porque abre en pestana nueva: sin esa
   pista, que el mapa no cambie al pulsar desconcierta. */
#enlaces{display:flex;flex-wrap:wrap;gap:8px;padding-top:13px;
         border-top:1px solid var(--borde)}
/* Sin boton no hay fila: un filo suelto al final del panel parece un error. */
#enlaces:empty{display:none}
.enlace{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;
        border-radius:99px;background:var(--verde);color:#fff;
        text-decoration:none;font:700 12.5px/1 system-ui,sans-serif;
        white-space:nowrap;pointer-events:auto;
        transition:background .25s ease,box-shadow .25s ease}
.enlace:hover{background:#005c33;box-shadow:0 6px 18px #00723f4d}
.enlace:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.enlace svg{width:14px;height:14px;flex:none;opacity:.85}

/* En pantalla ancha el panel pasa a lateral: una barra inferior desperdicia
   el ancho sobrante y deja el mapa chico y centrado.

   Va anclado de arriba a abajo en vez de centrado con translateY. Centrado
   funcionaba con las seis filas de chips de antes, pero un movil acostado
   tiene unos 360 px de alto: en cuanto el panel crece un poco se sale por
   los dos lados, y lo primero que se pierde es el boton del programa, que va
   al final. Anclado y con scroll propio, siempre se alcanza.

   Aqui si puede recibir el toque (en vertical no, para no comerse el mapa):
   el encuadre deja el mapa a la derecha del panel, asi que debajo no hay
   mapa que se pierda y en cambio hace falta para poder desplazar la lista.

   La barra de desplazamiento va oculta, como la de los chips: es un menu,
   no un documento, y el filo gris al lado del mapa afea. El desplazamiento
   sigue funcionando. */
@media (min-width:760px) and (orientation:landscape){
  #ficha{left:22px;right:auto;top:14px;bottom:14px;width:330px;
         transform:none;overflow-y:auto;pointer-events:auto;
         padding:20px;border-radius:20px;scrollbar-width:none}
  #ficha::-webkit-scrollbar{display:none}
  #chips{flex-wrap:wrap;overflow:visible}
  #enlaces{margin-top:auto}
  #enlaces .enlace{flex:1;justify-content:center}
  /* El encabezado empieza donde termina el panel. Los dos van anclados
     arriba a la izquierda, asi que sin esto el panel tapa el titulo: el
     encabezado empieza en x=20 y el panel llega hasta x=352.

     Se aparta el encabezado en vez de bajar el panel porque el mapa se
     encuadra a partir de su borde inferior: bajarlo le quitaria alto al
     mapa, y subirlo no cabe. */
  #cab{padding-left:372px}
}
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1224 792" preserveAspectRatio="xMidYMid meet">

           cambie la direccion. Sin el, el navegador y el CDN de GitHub Pages

      <image id="arte" href="rectoria-chico.webp?v=ee715691" x="0" y="0"

<header id="cab"><span id="marca">Día del Orgullo Cimarrón 2026</span>

<!-- La vista previa de un archivo de RecursosExtra que sea una imagen. Un

<div id="vista" hidden aria-modal="true" role="dialog">

    <button id="cierraVista" aria-label="Cerrar la vista previa">

<!-- La ventana que sale al tocar un icono con informacion. Es una sola para
     todos los iconos: se cambia su contenido y se muestra, en vez de tener
     una por icono. Con una sola no hay forma de que queden dos abiertas ni
     de que se acumulen en el DOM.

     El boton de enlace NO esta aqui escrito: lo arma el script. La direccion
     sale del archivo, y con `innerHTML` habria que escapar la URL a mano con
     el riesgo de que un despiste convierta el texto en una etiqueta. Con
     `createElement` y `href`, el navegador la trata como direccion y no como
     codigo, aunque lleve comillas o parentesis.

     Empieza en `hidden`, que ademas de esconderla la saca del alcance del
     teclado: con solo opacidad, el boton de cerrar seguiria siendo tabulable
     y el foco se iria a un sitio invisible. -->
<div id="ventana" hidden>
  <div id="cajaVentana" role="dialog" aria-modal="true" aria-labelledby="tVentana">
    <button id="cierraVentana" aria-label="Cerrar">

<script>
// ===========================================================================

// dejaba parte de la zona fuera de cuadro.

// Las bandas diagonales (estacionamientos y zonas de stands) van como

//
// Dos zonas no pueden solaparse: al tocar caeria la de encima y la otra
// quedaria inalcanzable justo ahi. Hay una prueba que lo comprueba con los
// ejes separadores, y otra que verifica que todas quepan en el mapa.
//
// Lo de abajo lo reescribe editor/editor.py. Si se edita a mano aqui, el
// editor no se entera y lo pisa la proxima vez que se guarde desde el.
// ===========================================================================
/* === INICIO ZONAS === */

  ["Estacionamiento A", "Estacionamiento A",
   [[196,232],[205,250],[479,359],[513,278],[229,163],[194,172],[185,214]],

  ["Estacionamiento B", "Estacionamiento B",

  ["Zona recreativa", "Zona recreativa",
   [[276,380],[477,380],[477,443],[277,442]],

/* === FIN ZONAS === */

// Vista general: el predio del campus con las dos calles que lo enmarcan.
var VISTA = [110, 100, 1005, 640];

/* === INICIO ENLACE === */
var ENLACE = {"t": "Programa del evento", "u": "RecursosExtra/11x17pl_Orgullo CImarron_Vrs4.jpg"};
/* === FIN ENLACE === */

// ===========================================================================
// Iconos: los simbolos de punto del mapa (banos, primeros auxilios, comida).

// Cada icono es [tipo, x, y, etiqueta, tamano]. El tamano es opcional: si

//
// El tipo se valida contra las dos listas: uno desconocido saldria como un
// hueco vacio y sin ningun error en la consola, que es la peor forma de
// fallar.
//
// Lo de abajo lo reescribe editor/editor.py, igual que las zonas.
// ===========================================================================
/* === INICIO ICONOS === */
var ICONOS = [
  {"t": "extintor-png", "x": 437, "y": 566, "n": "extintor-png", "s": 16, "a": "flota", "c": 0},
  {"t": "extintor-png", "x": 509, "y": 541, "n": "extintor-png", "s": 16, "a": "flota", "c": 0},

    trozos.push('<symbol id="ico-' + nombre + '" viewBox="' + caja[1] + '">'
              + svg.slice(abre + 1, cierra) + "</symbol>");
  });
  if (trozos.length) {
    s.querySelector("defs").insertAdjacentHTML("beforeend", trozos.join(""));
  }
}
sueltaIconosVector();

function figuraDe(tipo, conAro) {
  if (SIMBOLOS[tipo]) return '<g class="lam">' + SIMBOLOS[tipo] + "</g>";
  if (!PROPIOS[tipo]) return "";
  var recorte = conAro ? ' clip-path="url(#recorte)"' : "";
  // El vector, con un `<use>`: el dibujo esta en su `<symbol>` y aqui solo se
  // dice cual y donde. El navegador lo DIBUJA a la escala a la que se este
  // viendo, que es lo que lo mantiene nitido por mucho que se acerque.
  if (ES_VECTOR[tipo]) {
    return '<use class="fig" href="#ico-' + tipo + '" x="-12.2" y="-12.2"'
         + ' width="24.4" height="24.4"' + recorte + "/>";
  }
  return '<image class="fig" href="' + PROPIOS[tipo] + '" x="-12.2" y="-12.2"'
       + ' width="24.4" height="24.4"' + recorte + "/>";
}

// Como se llama un icono cuando no lleva etiqueta propia.
function nombreDe(tipo) {
  return NOMBRES[tipo] || tipo;
}

// Los iconos, encima del mapa. Uno con un tipo que no exista se salta en vez
// de dibujar un hueco: mejor un icono de menos que un circulo vacio que nadie
// sabe de donde sale.
//
// El transform lleva tres cosas, y el orden importa: translate al sitio, scale
// al tamano y rotate para girarlo. La rotacion va la ultima para que gire sobre
// su propio centro (el 0,0 donde esta dibujado), que es lo que uno espera al
// girar un icono. Si fuera antes del scale, giraria sobre un centro ya escalado
// y se iria del sitio.
ICN.innerHTML = ICONOS.map(function (ic, k) {
  // `c` en 0 es "sin circulo". Se comprueba en `conAroDe`, que lo mira con
  // `in` y no por lo que vale.
  var conAro = conAroDe(ic);
  var dentro = figuraDe(ic.t, conAro);
  if (!dentro) return "";

  // El <g> de dentro es el que anima. El de fuera lleva la posicion y no se
  // puede tocar: en SVG el transform de CSS pisa al atributo transform, asi
  // que animar el de fuera mandaria el icono a la esquina de la hoja.
  //
  // `pausa` marca lo que de verdad anima, para poder pararlo cuando no se ve.
  // Solo se pone si hay animacion: en un icono quieto la clase no haria nada y
  // solo ensuciaria el DOM.
  var clase = "an" + (ic.a ? " " + ic.a + " pausa" : "");
  var ondas = ic.a === "ondas" ? '<circle class="onda" r="13.4"/>' : "";
  var clases = "ic" + (conAro ? "" : " sinAro") + (ic.i ? " conInfo" : "");
  var caja = ic.i ? ' class="' + clases + '" data-info="' + k + '"'
                  : ' class="' + clases + '"';
  // La superficie que recibe el toque, solo en los que llevan informacion.
  // El aro la daria si lo llevaran, pero un icono sin aro se queda sin nada
  // que recoja la pulsacion: la imagen tiene el toque desactivado y el dibujo
  // de un simbolo son trazos sueltos. Sin este circulo el toque se cuela
  // hasta el mapa y lo que hace es deshacer el zoom.
  var toque = ic.i ? '<circle class="toque" r="13.4"/>' : "";
  // La intensidad del movimiento va en un `style` con solo la variable, para
  // que no pise el atributo `transform` de este mismo elemento, que es el que
  // pone el icono en su sitio. Se omite cuando vale 1, que es lo normal.
  var fuerza = (ic.m && ic.m !== 1) ? ' style="--m:' + ic.m + '"' : "";
  // La comilla que cierra el transform va al principio del ultimo trozo. Es
  // facil dejarla fuera (paso dos veces) y el navegador se traga la etiqueta
  // entera: el icono desaparece y solo sale un aviso en la consola.
  return "<g" + caja + fuerza + ' transform="translate(' + ic.x + "," + ic.y
       + ") scale(" + ((ic.s || TAM_ICONO) / 24) + ")"
       + (ic.r ? " rotate(" + ic.r + ")" : "") + '"><title>'
       + escapa(ic.n || nombreDe(ic.t)) + "</title>"
       + (conAro ? '<circle class="aro" r="13.4"/>' : "")
       + toque
       + '<g class="' + clase + '">'
       + ondas + dentro + "</g></g>";
}).join("");

// La caja de una zona, sacada de su poligono: [x, y, ancho, alto].
//
// Se calcula en vez de guardarse a mano. Tener las dos cosas era pedir que se
// desincronizaran, y paso: al ajustar los poligonos las cajas se quedaron
// viejas y el zoom dejaba parte de la zona fuera de cuadro. Hay una prueba
// que comprueba que cada caja cubra su poligono.
function caja(puntos) {
  var xs = [], ys = [], p;
  for (var j = 0; j < puntos.length; j++) {
    p = puntos[j];
    xs.push(p[0]);
    ys.push(p[1]);
  }
  var x = Math.min.apply(null, xs), y = Math.min.apply(null, ys);
  return [x, y, Math.max.apply(null, xs) - x, Math.max.apply(null, ys) - y];
}

// Coloca el dibujo para que el rectangulo [x,y,ancho,alto] quepa centrado en
// el hueco libre que dejan el encabezado y el panel, ampliandolo lo posible.
//
// Es un transform CSS sobre el <g>, no un viewBox animado: asi el navegador lo
// interpola solo y no hace falta ningun bucle en JS.
//
// Tres detalles que importan:
//  - getScreenCTM() del <svg> (que nunca se transforma) trae dos escalas
//    distintas, c.a para el eje X y c.d para el Y. Usar c.a en los dos ejes
//    descentra la vista.
//  - El centro util es el del hueco, no el del svg: si se centra en el svg,
//    la zona ampliada queda tapada por el panel o por el encabezado.
//  - El panel es barra inferior en vertical y lateral en apaisado, asi que el
//    hueco se mide de sus rectangulos en vez de suponer donde esta.
function encuadra(x, y, w, h, aire) {
  var c = s.getScreenCTM(), ux = c.a, uy = c.d,
      W = s.clientWidth, H = s.clientHeight,
      rc = cab.getBoundingClientRect(), rf = F.getBoundingClientRect(),
      lateral = rf.width < W * .62,
      arriba = rc.bottom,
      izq = lateral ? rf.right + 12 : 0,
      abajo = lateral ? 0 : H - rf.top,
      ancho = W - izq, alto = H - arriba - abajo,
      k = Math.min(ancho / (ux * w * aire), alto / (uy * h * aire)),
      cx = izq + ancho / 2, cy = arriba + alto / 2;
  // Solo se frena si el encuadre cambia de verdad. En un movil, `resize` salta
  // cada vez que se esconde o se asoma la barra del navegador, y encuadra() se
  // llama tambien ahi: sin esta comprobacion, mover el dedo por la pantalla
  // dejaria las animaciones congeladas un rato largo sin que nada se moviera.
  var puesto = M.style.transform;
  var nuevo = "translate(" + ((cx - c.e) / ux - k * (x + w / 2)) + "px,"
            + ((cy - c.f) / uy - k * (y + h / 2)) + "px) scale(" + k + ")";
  if (nuevo === puesto) return;
  frenaUnRato(800);
  M.style.transform = nuevo;
}

function pinta(k) {
  A = k;
  for (var j = 0; j < K.length; j++) K[j].classList.toggle("act", j == k);
  // El mapa avisa de si esta acercado, y los iconos con informacion se agarran
  // a eso: con el mapa entero delante no reciben el toque, asi que un dedo
  // encima de uno acerca la zona que tiene debajo, como en cualquier otro
  // sitio del plano. Con una zona ampliada, el icono manda.
  ICN.classList.toggle("deCerca", k >= 0);
}

function sel(k) {
  var z = ZONAS[k], c = caja(z[2]);
  pinta(k);
  TITULO.textContent = z[0];
  PISTA.textContent = z[3];
  F.classList.add("on");
  encuadra(c[0], c[1], c[2], c[3], 1.14);
  // Acercar es exactamente el momento en que hace falta el detalle del fondo,
  // asi que aqui es donde entra la version grande. No hay mas sitios que
  // acerquen: el mapa se acerca tocando una zona o un boton, y los dos pasan
  // por aqui.
  traeLaGrande();
}

function todo() {
  pinta(-1);
  TITULO.textContent = "Mapa del evento";
  PISTA.textContent = "Toca una zona para acercarla";
  F.classList.remove("on");
  encuadra(VISTA[0], VISTA[1], VISTA[2], VISTA[3], 1.04);
}

// --- Cuando no hace falta animar -------------------------------------------
// Las animaciones son lo unico de esta pagina que trabaja sin parar, y medido
// resulta que el gasto esta en el fotograma, no en los iconos: da casi lo
// mismo un icono animado que cuarenta. Lo que de verdad cuesta es no parar
// nunca, porque el navegador tiene que componer un fotograma a la frecuencia
// de la pantalla mientras haya algo moviendose. Con cero animaciones no
// compone ninguno.
//
// En un ordenador no se nota. En un telefono de gama baja si, y ahi es donde
// el mapa se traba. Asi que se para en los dos casos en que nadie mira:

// 1. Mientras el mapa se mueve. Durante el zoom hay que reencuadrar y volver a
//    dibujar el mapa entero en cada fotograma; si ademas hay cuarenta iconos
//    animandose, las dos cosas se pelean por el mismo sitio. Se paran un
//    momento y el movimiento sale limpio. Al acabar siguen por donde iban,
//    porque `animation-play-state` no reinicia la animacion.
var relojFreno = 0;

function frenaUnRato(ms) {
  // El freno va en #m, que es el padre comun de las zonas y de los iconos: una
  // sola clase los para todos.
  M.classList.add("frenado");
  // Y `acercando` pone el `will-change` que sube el mapa a su propia capa. Va
  // aqui porque dura exactamente lo mismo que el freno: mientras el mapa se
  // mueve. Al soltarse, el navegador vuelve a dibujarlo a la resolucion nueva
  // en vez de escalar la textura de antes, que es lo que lo saca pixelado.
  M.classList.add("acercando");
  clearTimeout(relojFreno);
  relojFreno = setTimeout(sueltaAnimaciones, ms);
}

function sueltaAnimaciones() {
  clearTimeout(relojFreno);
  // Con la pagina escondida no se sueltan: no hay nada que mirar y el
  // navegador no deberia estar componiendo fotogramas.
  if (!document.hidden) M.classList.remove("frenado");
  // La capa se suelta SIEMPRE, tambien con la pagina escondida. Si se quedara
  // puesta, el mapa se quedaria escalado como una foto y al volver a mirarlo
  // los iconos saldrian pixelados.
  M.classList.remove("acercando");
}

// 2. Con la pagina escondida (otra pestana delante, o el movil bloqueado). Un
//    mapa abierto detras no tiene por que seguir gastando bateria.
addEventListener("visibilitychange", function () {
  if (document.hidden) M.classList.add("frenado");
  else sueltaAnimaciones();
});

// 3. Lo que ha quedado fuera de la pantalla. Se nota sobre todo ampliado: en un
//    movil, mirando una zona de cerca, se ven cuatro o cinco cosas de las 58
//    que hay, y el resto estaba costando lo mismo sin que nadie las viera.
//
// Se hace con un IntersectionObserver y no calculando a mano que cae dentro:
// asi vale tambien al girar el movil, al cambiar de zona y al redimensionar,
// sin repetir la cuenta en cada sitio. El `rootMargin` deja animandose lo que
// esta un poco fuera, para que al asomar por el borde ya vaya moviendose.
//
// Se observan los dos grupos: las zonas se pausan en su propio poligono y los
// iconos en su grupo de dentro, asi que se busca quien lleve la clase `pausa`.
function elQueSePausa(nodo) {
  return nodo.classList.contains("pausa") ? nodo : nodo.querySelector(".pausa");
}

if (window.IntersectionObserver) {
  var vigia = new IntersectionObserver(function (entradas) {
    for (var j = 0; j < entradas.length; j++) {
      var pausable = elQueSePausa(entradas[j].target);
      if (pausable) pausable.classList.toggle("fuera", !entradas[j].isIntersecting);
    }
  }, {rootMargin: "160px"});
  var vigilar = function (grupo) {
    for (var j = 0; j < grupo.children.length; j++) vigia.observe(grupo.children[j]);
  };
  vigilar(ICN);
  vigilar(ZON);
}

// --- La ventana de informacion ---------------------------------------------
// Al tocar un icono con informacion sale una ventana con su titulo y su
// texto. Es la misma ventana para todos: se cambia el contenido y se muestra.
var VENT = document.getElementById("ventana"),
    SELLO = document.getElementById("selloVentana"),
    TVENT = document.getElementById("tVentana"),
    XVENT = document.getElementById("xVentana"),
    BOTON = document.getElementById("botonVentana"),
    CVENT = document.getElementById("cierraVentana");

// Solo http y https. La direccion es texto que viene del archivo, y el archivo
// lo puede editar cualquiera a mano: un `javascript:` ahi seria una forma de
// ejecutar codigo en la pagina de quien mira el mapa. Se comprueba aqui
// ademas de en el editor, porque el editor es el que lo escribe pero el que lo
// lee es esto.
//
// Se exige el dominio entero (`https://` y algo detras). Una direccion sin
// esquema, como `owncloud.rec.uabc.mx`, el navegador la toma por una ruta
// relativa a esta pagina y no lleva a ninguna parte.
function enlaceSeguro(u) {
  return esRecurso(u) || /^https?:\/\/[^\s]+$/i.test(String(u || ""));
}

// La flecha de salir fuera, la misma que la del boton del panel. Es una
// constante y no un dato del archivo, asi que puede ir con innerHTML.
var FLECHA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
           + ' stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"'
           + ' aria-hidden="true">'
           + '<path d="M14 3.5h6.5V10"/><path d="M20.5 3.5 11 13"/>'
           + '<path d="M18 14.5v5A1.5 1.5 0 0 1 16.5 21h-12A1.5 1.5 0 0 1 3 19.5'
           + 'v-12A1.5 1.5 0 0 1 4.5 6h5"/></svg>';

// La flecha de descarga, para el boton que lleva a un documento. Es la misma
// idea que la de salir fuera pero al reves: aqui el archivo se queda, no se
// va a otra pagina, y de un vistazo hay que poder saber cual de las dos cosas
// hace cada boton.
var DESCARGA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
             + ' stroke-width="2.4" stroke-linecap="round"'
             + ' stroke-linejoin="round" aria-hidden="true">'
             + '<path d="M12 3.5v11"/><path d="M7.5 10 12 14.5 16.5 10"/>'
             + '<path d="M4.5 19.5h15"/></svg>';

// --- Los archivos de RecursosExtra ------------------------------------------
// Un boton puede llevar a una direccion de fuera o a un archivo del propio
// repositorio. Los archivos viven en RecursosExtra, en la raiz, un nivel por
// encima de esta pagina: el croquis esta dentro de plantilla/.
//
// No van dentro del croquis porque el croquis se descarga ENTERO al abrir el
// QR: un PDF de unos megas en base64 dentro del HTML dejaria el mapa
// inservible en un movil, y se bajaria aunque nadie lo abriera.
var CARPETA_RECURSOS = "RecursosExtra/";
var BASE_RECURSOS = "../" + CARPETA_RECURSOS;

// Las extensiones que se ensenan en una vista previa. Las demas se descargan,
// porque no hay nada que mirar dentro. La misma lista esta en
// editor/validar.py, y una prueba comprueba que las dos dicen lo mismo: el
// croquis decide al pulsar y el editor al elegir, y ninguno de los dos puede
// preguntarle al otro en ese momento.
var IMAGENES = ["png", "jpg", "jpeg", "webp", "gif", "avif", "svg", "bmp"];

function esRecurso(u) {
  return typeof u === "string" && u.indexOf(CARPETA_RECURSOS) === 0;
}

function direccionDe(u) {
  return esRecurso(u) ? BASE_RECURSOS + u.slice(CARPETA_RECURSOS.length) : u;
}

function nombreDeRecurso(u) {
  return String(u).split("/").pop();
}

function esImagen(u) {
  var limpio = String(u).split("?")[0].split("#")[0].toLowerCase();
  var punto = limpio.lastIndexOf(".");
  return punto > 0 && IMAGENES.indexOf(limpio.slice(punto + 1)) >= 0;
}

// Arma un boton: el texto, la direccion y que pasa al pulsarlo.
//
// El elemento es un <a> de verdad, con su `href`, y no un boton que llame a
// window.open: asi funcionan el clic con la rueda, el de en medio y el menu de
// «abrir en otra pestana», que es lo que espera cualquiera al ver un enlace.
// Y con `href` puesto, si el JavaScript fallara el boton seguiria llevando a
// donde tiene que llevar.
function montaEnlace(a, texto, destino) {
  a.textContent = "";
  // La comprobacion va AQUI y no en quien llama: este es el unico sitio que
  // pone la direccion en el enlace, asi que es el unico por el que se puede
  // colar una mala, venga de donde venga.
  if (!texto || !enlaceSeguro(destino)) {
    a.hidden = true;
    a.removeAttribute("href");
    return;
  }
  var dentro = esRecurso(destino), archivo = dentro && !esImagen(destino);
  a.hidden = false;
  a.href = direccionDe(destino);
  a.dataset.destino = destino;
  // Un archivo del propio sitio se descarga con `download`, y eso solo
  // funciona en el mismo dominio. Estos lo estan: los sirve el mismo GitHub
  // Pages que sirve esta pagina. Fuera, `download` se ignora y el navegador
  // abre el archivo, que es lo unico que puede hacer.
  if (archivo) {
    a.setAttribute("download", "");
    a.removeAttribute("target");
    a.removeAttribute("rel");
  } else if (dentro) {
    a.removeAttribute("download");
    a.removeAttribute("target");
    a.removeAttribute("rel");
  } else {
    a.removeAttribute("download");
    a.setAttribute("target", "_blank");
    // `noopener` porque el destino es ajeno: sin el, esa pagina puede
    // manipular esta desde `window.opener`.
    a.setAttribute("rel", "noopener noreferrer");
  }
  a.innerHTML = archivo ? DESCARGA : FLECHA;
  a.appendChild(document.createTextNode(texto));
}

// Lo unico que el <a> no puede hacer solo es ensenar la vista previa, asi que
// es lo unico que se intercepta. Todo lo demas lo hace el navegador.
function alPulsarEnlace(e) {
  var destino = e.currentTarget.dataset.destino;
  if (esRecurso(destino) && esImagen(destino)) {
    e.preventDefault();
    abreVista(destino);
  }
}

// --- La vista previa ---------------------------------------------------------
var VISTA_F = document.getElementById("vista"),
    FVISTA = document.getElementById("fvista"),
    CERRAR_VISTA = document.getElementById("cierraVista"),
    // Descargar. Se arma aqui y no en el marcado porque lleva un `href` que
    // solo se sabe al abrir la vista, y un `<a>` sin destino no vale.
    //
    // Y es un `<a>` con `download` y no un boton que llame a nada: asi el
    // navegador hace el trabajo entero -su barra de progreso, su nombre de
    // archivo-, y funciona aunque el JavaScript falle despues. `download`
    // solo se obedece en el mismo dominio, y estos archivos lo estan: los
    // sirve el mismo GitHub Pages que sirve esta pagina.
    BAJA = document.createElement("a");
BAJA.id = "bajaVista";
BAJA.innerHTML = DESCARGA;
BAJA.setAttribute("download", "");
BAJA.setAttribute("aria-label", "Descargar la imagen");
// A la izquierda de cerrar: descargar es lo que se hace a proposito y cerrar
// lo que se hace al acabar, y el que se pulsa sin querer conviene que sea el
// de la punta.
CERRAR_VISTA.parentNode.insertBefore(BAJA, CERRAR_VISTA);

function abreVista(destino) {
  var url = direccionDe(destino);
  FVISTA.src = url;
  FVISTA.alt = nombreDeRecurso(destino);
  // El boton de descargar apunta al mismo archivo, con su nombre por delante
  // para que se guarde con el que tiene y no con el que le ponga el navegador.
  BAJA.href = url;
  BAJA.setAttribute("download", nombreDeRecurso(destino));
  VISTA_F.hidden = false;
  // Un fotograma con `hidden` ya quitado antes de la clase, o el navegador no
  // ve el cambio y la vista aparece de golpe sin la transicion.
  requestAnimationFrame(function () { VISTA_F.classList.add("on") });
  document.getElementById("cierraVista").focus({preventScroll: true});
}

function cierraVista() {
  if (VISTA_F.hidden) return;
  VISTA_F.classList.remove("on");
  setTimeout(function () {
    if (VISTA_F.classList.contains("on")) return;
    VISTA_F.hidden = true;
    // Se suelta la imagen: un plano grande se quedaria en memoria sin que
    // nadie lo mire, y esto se abre en un movil.
    FVISTA.removeAttribute("src");
  }, 220);
}

document.getElementById("cierraVista").addEventListener("click", cierraVista);
VISTA_F.addEventListener("pointerdown", function (e) {
  if (e.target === VISTA_F) cierraVista();
});

// El boton del mapa, el que sale debajo de los accesos rapidos. Se arma aqui
// entero, texto y direccion, desde el bloque ENLACE: el marcado solo tiene el
// hueco donde va. Un croquis sin boton -ENLACE en null- se queda con el hueco
// vacio y el filo no se pinta (lo esconde `#enlaces:empty`).
var ENLACES = document.getElementById("enlaces");
if (ENLACE && ENLACE.t && ENLACE.u) {
  var ENLACE_MAPA = document.createElement("a");
  ENLACE_MAPA.className = "enlace";
  ENLACE_MAPA.addEventListener("click", alPulsarEnlace);
  montaEnlace(ENLACE_MAPA, ENLACE.t, ENLACE.u);
  ENLACES.appendChild(ENLACE_MAPA);
}

// El boton que sale dentro de la ventana, si el icono lleva uno. Se vacia
// siempre antes: la ventana es una sola para todos los iconos, asi que si no
// se limpiara, el enlace del icono de antes seguiria ahi al abrir otro.
function pintaBoton(ic) {
  BOTON.textContent = "";
  var u = ic.u;
  if (!u) return;
  var a = document.createElement("a");
  a.className = "enlace";
  a.addEventListener("click", alPulsarEnlace);
  // El texto y la direccion salen del archivo. La direccion la comprueba
  // `montaEnlace` antes de ponerla en el `href`: lo que no pase la prueba no
  // llega a ser un enlace.
  montaEnlace(a, u[0], u[1]);
  if (!a.hidden) BOTON.appendChild(a);
}

// Cuanto mide el sello de la ventana y cuantos pixeles se dejan libres a cada
// lado del dibujo. El lado tiene que ser el mismo que el `width` del sello en
// el CSS; si no coincide, el margen sale mas grande o mas pequeno de lo pedido.
var SELLO_LADO = 52, SELLO_LIBRES = 5;

// Encaja el dibujo dentro del sello dejandole `SELLO_LIBRES` pixeles libres por
// los cuatro lados.
//
// El hueco se hace moviendo el `viewBox`, no con un `padding`: un padding fijo
// deja el mismo hueco en unidades del dibujo, y como cada icono ocupa su caja
// lo que quiere, unos salen pegados al borde y otros diminutos. Midiendo el
// dibujo de verdad, todos acaban del mismo tamano con el mismo aire.
//
// Se mide con `getBBox()`, que da la caja del DIBUJO y no la del elemento: en
// un simbolo son sus trazos y en una imagen es su recuadro. Necesita el
// elemento dentro del documento y con caja, asi que esto va despues de meter
// el dibujo en el sello y con la ventana ya sin `hidden`.
//
// Si algo de esto falla, se deja el `viewBox` que traia el SVG: un icono algo
// mas pequeno es mucho mejor que una ventana que no abre.
function encajaSello(svg) {
  if (!svg || !svg.getBBox) return;
  var dibujo = svg.firstElementChild, caja;
  if (!dibujo || !dibujo.getBBox) return;
  try {
    caja = dibujo.getBBox();
  } catch (e) {
    return;                       // el nodo no se puede medir todavia
  }
  if (!(caja.width > 0) || !(caja.height > 0)) return;
  var ancho = svg.getBoundingClientRect().width || SELLO_LADO;
  // El lado del viewBox para que el dibujo quepa en (ancho - 2 * libres).
  var lado = Math.max(caja.width, caja.height) * ancho / (ancho - 2 * SELLO_LIBRES);
  var cx = caja.x + caja.width / 2, cy = caja.y + caja.height / 2;
  svg.setAttribute("viewBox", (cx - lado / 2) + " " + (cy - lado / 2)
                              + " " + lado + " " + lado);
}

function abreVentana(k) {
  var ic = ICONOS[k];
  if (!ic || !ic.i) return;
  TVENT.textContent = ic.i[0];
  XVENT.textContent = ic.i[1];
  // La miniatura se dibuja con la misma figura que el icono del mapa, para
  // que se vea de cual se trata. El SVG se arma aqui y no se copia del mapa
  // porque alli el icono lleva el transform de la posicion, y copiarlo tal
  // cual lo dejaria fuera de la caja.
  //
  // Los iconos propios van DENTRO del svg, como imagen, y no sueltos en un
  // `<img>`: asi el encaje lo hace el propio SVG, que sabe mantener la
  // proporcion, y el dibujo nunca se recorta. Un `<img>` con `object-fit:
  // cover` escala la imagen hasta llenar la caja, y una gota alargada perdia
  // la punta y la base.
  //
  // Se pide `figuraDe(..., false)`, sin el recorte en circulo: aqui el icono
  // va suelto dentro del sello, y el circulo lo pone el fondo crema.
  var conAro = conAroDe(ic);
  SELLO.setAttribute("class", conAro ? "" : "sinAro");
  SELLO.innerHTML = '<svg viewBox="-13 -13 26 26">' + figuraDe(ic.t, false)
                  + "</svg>";
  SELLO.setAttribute("aria-hidden", "true");
  pintaBoton(ic);
  VENT.hidden = false;
  // El encaje va aqui: con la ventana en `display:none` no hay caja que medir.
  // Y va antes del fotograma de la transicion, cuando el navegador todavia no
  // ha pintado, asi que el ajuste no se llega a ver.
  encajaSello(SELLO.firstElementChild);
  // Un fotograma con `hidden` ya quitado antes de poner la clase, o el
  // navegador no ve el cambio de estado y la ventana aparece de golpe sin
  // transicion.
  requestAnimationFrame(function () { VENT.classList.add("abierta") });
  CVENT.focus({preventScroll: true});
}

function cierraVentana() {
  if (VENT.hidden) return;
  VENT.classList.remove("abierta");
  // Se espera a que termine la transicion para volver a esconderla. Si se
  // esconde antes, desaparece de golpe; y si se deja visible, el fondo sigue
  // interceptando el toque y el mapa deja de responder.
  setTimeout(function () {
    if (!VENT.classList.contains("abierta")) VENT.hidden = true;
  }, 240);
}

CVENT.addEventListener("click", cierraVentana);
// Tocar el fondo tambien cierra. Se compara contra el propio fondo y no
// contra la caja, para que un clic dentro del texto no la cierre.
VENT.addEventListener("pointerdown", function (e) {
  if (e.target === VENT) cierraVentana();
});
addEventListener("keydown", function (e) {
  if (e.key === "Escape") cierraVentana();
});

// Un icono con informacion se toca, pero SOLO con una zona ampliada. Con el
// mapa entero no se puede: en esa vista los iconos son marcas de referencia y
// una ventana encima taparia justo lo que se estaba mirando.
//
// El toque no puede llegar al <svg>, que es el que hace el zoom: si llegara,
// ademas de abrir la ventana se desharia el zoom por detras. Por eso se corta
// en el pointerdown, que es cuando el <svg> escucha. Sin zoom no se corta
// nada, y el toque acerca la zona de debajo igual que en el resto del mapa.
ICN.addEventListener("pointerdown", function (e) {
  if (A >= 0 && e.target.closest(".conInfo")) e.stopPropagation();
});
ICN.addEventListener("click", function (e) {
  if (A < 0) return;
  var g = e.target.closest("[data-info]");
  if (g) abreVentana(+g.dataset.info);
});

// Si ya hay una zona ampliada, cualquier toque deshace el zoom, toque donde
// toque: al ampliar, la zona ocupa casi toda la pantalla y no queda fondo
// donde pulsar.
s.addEventListener("pointerdown", function (e) {
  if (A >= 0) return todo();
  var g = e.target.closest(".g");
  if (g) sel(+g.dataset.i);
});
CH.addEventListener("click", function (e) {
  var c = e.target.closest(".chip");
  if (c) sel(+c.dataset.i);
});

// --- El fondo, en dos tamanos -----------------------------------------------
// El fondo es el 90 % de lo que se descarga el movil -483 KB- y ocupa 30 MB en
// memoria al dibujarlo, mas que todo lo demas junto. Por eso hay DOS versiones
// del mismo dibujo: una de 1600 px que es la que se abre siempre, y otra de
// 3400 que entra al acercar una zona, que es cuando hace falta el detalle.
//
// Medido: en un telefono en vertical el mapa se ve a 375 x 242 px nada mas
// abrir, o sea la sexta parte de su ancho. Se bajaba y decodificaba la imagen
// entera -y sus 30 MB- para ensenar eso. Con las dos, el primer pintado baja
// de 540 KB a unos 230 KB y la memoria de 30 MB a 6,6 MB, y el detalle llega
// cuando se pide. Quien solo mira el mapa no se baja nunca la grande.
//
// Las dos salen del mismo dibujo y con los mismos ajustes -las hace
// `preparar_mapa.py`-, asi que al cambiar de una a otra no se nota el salto.
//
// No se le cambia el `href` a una sola imagen: se ENCIENDE la grande encima
// cuando ya esta cargada. Cambiarle la direccion a la que se esta viendo deja
// el mapa en blanco mientras llega, y eso se ve; un fundido de un tercio de
// segundo, no.
var ARTE = document.getElementById("arte"),
    ARTE_GRANDE = document.getElementById("arteGrande"),
    // El `?v=` de la grande. Lo comprueba una prueba contra el sha1 del
    // archivo, como el de la chica: un numero viejo no da ningun error, solo
    // un mapa que no cambia cuando deberia.
    ARTE_URL = "rectoria.webp?v=ff7dd9e5",
    ANCHO_CHICO = 1600,
    pidiendoGrande = false;

function traeLaGrande() {
  if (pidiendoGrande) return;
  pidiendoGrande = true;
  ARTE_GRANDE.setAttribute("href", ARTE_URL);
  ARTE_GRANDE.addEventListener("load", function () {
    ARTE_GRANDE.style.opacity = "1";
    // Y la chica se suelta: debajo ya no se ve, y son 6,6 MB que no hacen
    // falta para nada. Se espera a que acabe el fundido, o habria un
    // fotograma sin fondo entre que se suelta una y se ve la otra.
    setTimeout(function () {
      ARTE.removeAttribute("href");
      ARTE.style.display = "none";
    }, 420);
  }, {once: true});
}

// Cuantos pixeles reales ocupa el mapa de ancho con el encuadre de arranque.
// El <svg> es mas ancho que el mapa -lo que sobra se queda de margen-, asi que
// hay que quedarse con el menor de los dos lados.
//
// Las medidas salen del propio `viewBox` y no de dos numeros escritos aqui:
// el dia que cambie el lienzo, esto sigue diciendo la verdad solo.
function anchoNecesario() {
  var vb = s.viewBox.baseVal;
  var lado = Math.min(s.clientWidth, s.clientHeight * vb.width / vb.height);
  return lado * (devicePixelRatio || 1);
}

// Cuando traer la grande por adelantado. Es lo que evita el unico defecto de
// tener dos versiones: si solo se trajera al acercar, entre el toque y la
// llegada del archivo el mapa se veria blando, y en un movil con pantalla
// densa eso se nota.
//
// Con una conexion rapida esos 483 KB no se notan y nadie llega a verlo
// blando. Con una lenta -o si quien mira ha pedido ahorrar datos- se espera a
// que de verdad se acerque, y se ahorra.
//
// `effectiveType` solo tiene cuatro valores -slow-2g, 2g, 3g y 4g-, y el 4g
// quiere decir «no va mal», no la tecnologia. No existe el 5g ahi.
function conexionRapida() {
  var c = navigator.connection;
  if (!c) return true;             // sin dato, se supone que si
  if (c.saveData) return false;
  return !c.effectiveType || c.effectiveType === "4g";
}

// El encuadre depende del alto del encabezado y del panel, que cambian al
// girar el movil o al cruzar el punto donde el panel pasa a lateral.
addEventListener("resize", function () { A >= 0 ? sel(A) : todo() });
// El mapa tarda un poco en cargar: hasta que no este, el <svg> no tiene
// tamano real y el encuadre saldria mal.
if (!ARTE.complete) ARTE.addEventListener("load", todo);
todo();
// Con la pantalla delante se puede medir de verdad cuanto ocupa el mapa, asi
// que la decision de empezar por la grande se toma aqui y no apurado antes.
//
// Se empieza por la chica salvo que ni de lejos llegue: un monitor normal con
// la pantalla densa necesita mas de 1600 px solo para mirarlo de lejos, y ahi
// ahorrar esa descarga no tendria sentido -es instantanea- a cambio de verlo
// borroso.
//
// En un movil en vertical, que es de donde venia el problema, el mapa ocupa
// unos 375 px de ancho: 750 reales en una pantalla densa, menos de la mitad de
// 1600. Ahi si se empieza por la chica, y la grande espera a que alguien
// acerque.
if (anchoNecesario() > ANCHO_CHICO) {
  traeLaGrande();
} else if (conexionRapida()) {
  // Se trae sola un momento despues de pintar, para no competir con lo que se
  // ve. En una conexion rapida no se nota, y asi el mapa nunca se ve blando al
  // acercar porque ya esta.
  var cuando = window.requestIdleCallback || function (f) { setTimeout(f, 1400) };
  cuando(function () { traeLaGrande() }, {timeout: 3000});
}
</script>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-content:center;text-align:center;padding:20px;overflow:hidden;
 background:#0b0a12;color:#f7f4ef;font-family:system-ui,sans-serif}
body:before{content:"";position:fixed;inset:-30%;z-index:-1;
 background:radial-gradient(40% 40% at 22% 24%,#ff4d6d77,transparent 60%),
            radial-gradient(46% 46% at 78% 72%,#12c2e999,transparent 60%);
 animation:deriva 20s ease-in-out infinite alternate}
h1{font-family:Bebas Neue,Impact,sans-serif;font-size:clamp(3.4rem,19vw,8rem);line-height:.84;
 background:linear-gradient(92deg,#ffb703,#ff4d6d 45%,#12c2e9);-webkit-background-clip:text;
 background-clip:text;color:transparent;animation:entra .9s cubic-bezier(.2,.8,.2,1) both}
button{font:inherit;font-weight:700;color:#0b0a12;background:#ffb703;cursor:pointer;
 border:0;border-radius:99px;padding:13px 26px;transition:.45s cubic-bezier(.2,.8,.2,1);
 animation:entra .9s cubic-bezier(.2,.8,.2,1) .15s both}
button:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 12px 40px #ffb70399}
body.activo button{background:#12c2e9;transform:rotate(-2deg) scale(1.04)}
body.activo h1{filter:hue-rotate(60deg)}
@keyframes entra{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes salta{to{transform:scaleY(.2)}}
@keyframes deriva{to{transform:translate3d(4%,-3%,0) rotate(6deg)}}
</style>
</head>
<body>
<main>
  <h1>Orgullo<br>Cimarrón</h1>
  <div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <button onclick="document.body.classList.toggle('activo')">Toca y cambia</button>
</main>
</body>
</html>
